function ensureThree(){
  if(window.THREE) return Promise.resolve(window.THREE);
  if(window.__threePromise) return window.__threePromise;
  window.__threePromise = new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    s.onload = ()=> resolve(window.THREE);
    s.onerror = ()=> reject(new Error('Could not load the 3D library'));
    document.head.appendChild(s);
  });
  return window.__threePromise;
}
// Bridges the new spec to the legacy 5-field shape a few older call
// sites still read. Nothing new should use this.
function specToLegacyGeometry(spec){
  if(!spec) return null;
  const o = spec.overall||{}, s = spec.screw||{}, t = spec.trough||{};
  const L = dimIn(o.overall_length);
  const D = dimIn(s.screw_diameter) || dimIn(t.trough_width);
  return {
    diameterIn: D,
    lengthFt: L!=null ? L/12 : null,
    inclineDeg: dimIn(o.incline_angle)!=null ? o.incline_angle.value : null,
    hangerCount: (spec.hangers && spec.hangers.count!=null) ? Number(spec.hangers.count) : null,
    shaftless: !!(s.shaftless)
  };
}

/* ================================================================
   DETERMINISTIC 3D GEOMETRY GENERATOR
   Consumes ONLY the validated engineering spec. Every dimension used
   here traces to a blueprint callout. Anything the spec does not
   supply is either omitted or drawn as an explicitly-marked
   placeholder -- it is never estimated into existence.

   Model space: 1 unit = 1 inch, matching normalized_in throughout.
   ================================================================ */
const MODEL_MODES = { engineering:'engineering', assembly:'assembly' };
let modelMode = MODEL_MODES.engineering;
let showDimensions = false;
// Records what the generator actually built, for the verification report.
let lastBuildRecord = null;

function makeTextSprite(THREE, text, color){
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  const font = 'bold 44px -apple-system, Segoe UI, Roboto, sans-serif';
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text).width) + 24;
  cv.width = w; cv.height = 60;
  const c2 = cv.getContext('2d');
  c2.font = font;
  c2.fillStyle = 'rgba(11,13,15,0.85)';
  c2.fillRect(0,0,cv.width,cv.height);
  c2.fillStyle = color || '#f5b400';
  c2.textBaseline = 'middle';
  c2.fillText(text, 12, cv.height/2);
  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, depthTest:false, transparent:true }));
  spr.userData.aspect = cv.width/cv.height;
  return spr;
}

async function buildModel(job){
  const host = document.getElementById('modelStage');
  if(!host) return;
  const spec = job.spec;
  if(!spec){ host.innerHTML = `<div class="empty-state" style="padding:24px;">No engineering specification -- re-scan the blueprint.</div>`; return; }

  let THREE;
  try{ THREE = await ensureThree(); }
  catch(e){ host.innerHTML = `<div class="empty-state" style="padding:24px;">3D view unavailable offline.</div>`; return; }
  if(!document.getElementById('modelStage')) return;
  disposeModel();

  const o = spec.overall||{}, tr = spec.trough||{}, sc = spec.screw||{}, hg = spec.hangers||{}, dr = spec.drive||{}, tl = spec.tail||{}, fr = spec.frame||{};
  const isScrew = spec.conveyorType !== 'belt';

  // --- Read the spec. Nulls stay null; no fallback constants. ---
  const L  = dimIn(o.overall_length);
  const OW = dimIn(o.overall_width);
  const D  = isScrew ? (dimIn(sc.screw_diameter) || dimIn(tr.trough_width)) : null;
  const troughW = dimIn(tr.trough_width) || D;
  const troughD = dimIn(tr.trough_depth);
  const shaftD  = dimIn(sc.shaft_diameter);
  const pitch   = dimIn(sc.screw_pitch) || D; // standard-pitch screw: pitch = diameter
  const pitchIsDirect = dimIn(sc.screw_pitch) != null;
  const inclineDeg = dimIn(o.incline_angle)!=null ? o.incline_angle.value : 0;
  const incline = (inclineDeg||0) * Math.PI/180;

  const approx = [];        // things drawn as explicit placeholders
  const built = {};         // what we actually built, for verification

  if(L == null){
    host.innerHTML = `<div class="empty-state" style="padding:24px;">Overall length was not found on the drawing.<br>
      <span style="font-size:11px;color:var(--text-faint);">The model is not generated rather than guessed. See the Engineering Data panel below.</span></div>`;
    lastBuildRecord = { built:{}, approx:['entire model -- no overall length'] };
    return;
  }

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x181c20);
  const camera = new THREE.PerspectiveCamera(45, host.clientWidth/host.clientHeight, 0.1, 100000);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(host.clientWidth, host.clientHeight);
  host.innerHTML = '';
  host.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.68));
  const key = new THREE.DirectionalLight(0xffffff, 0.72);
  key.position.set(0.6, 1.6, 1.1);
  scene.add(key);

  const root = new THREE.Group();
  root.rotation.z = incline;              // exact, from the drawing
  scene.add(root);
  const groups = {};
  STAGE_ORDER.forEach(s=>{ groups[s] = new THREE.Group(); root.add(groups[s]); });
  const dimGroup = new THREE.Group(); scene.add(dimGroup);

  const mat = (hex, opts) => new THREE.MeshStandardMaterial({ color:hex, metalness:0.35, roughness:0.55, ...(opts||{}) });
  const ghost = hex => new THREE.MeshStandardMaterial({ color:hex, metalness:0.1, roughness:0.9, transparent:true, opacity:0.32, wireframe:true });

  built.overall_length_in = L;
  built.incline_deg = inclineDeg || 0;

  if(isScrew){
    // ---- Trough: exact width/depth when given, half-round otherwise ----
    if(troughW){
      const R = troughW/2;
      const depth = troughD || R;   // U-trough: depth = half width unless stated
      if(!troughD) approx.push('trough depth (assumed half of trough width)');
      const tg = new THREE.CylinderGeometry(R, R, L, 32, 1, true, Math.PI, Math.PI);
      const trough = new THREE.Mesh(tg, mat(STAGE_META.trough.color, {side:THREE.DoubleSide, metalness:0.2}));
      trough.rotation.z = Math.PI/2;
      groups.trough.add(trough);
      // Angle flanges along both top edges
      const flH = dimIn(tr.flange_height) || Math.max(R*0.18, 1);
      if(!dimIn(tr.flange_height)) approx.push('flange height');
      [-1,1].forEach(sgn=>{
        const fl = new THREE.Mesh(new THREE.BoxGeometry(L, flH*0.25, flH), mat(STAGE_META.trough.color, {metalness:0.3}));
        fl.position.set(0, 0, sgn*R);
        groups.trough.add(fl);
      });
      built.trough_width_in = troughW;
      built.trough_depth_in = depth;
    }else{
      approx.push('trough (no width found -- omitted)');
    }

    // ---- Screw: real helix at the drawing's pitch, not decorative rings ----
    if(D){
      const R = D/2;
      const turns = Math.max(1, L/pitch);
      const segsPerTurn = 24;
      const total = Math.ceil(turns*segsPerTurn);
      const inner = shaftD ? shaftD/2 : R*0.12;
      if(!shaftD && !sc.shaftless) approx.push('shaft diameter');
      // Build the flight as a ribbon of quads following the true helix.
      const positions = [];
      for(let i=0;i<total;i++){
        const t0 = i/segsPerTurn, t1 = (i+1)/segsPerTurn;
        const x0 = -L/2 + t0*pitch, x1 = -L/2 + t1*pitch;
        if(x1 > L/2) break;
        const a0 = t0*Math.PI*2, a1 = t1*Math.PI*2;
        const o0 = [x0, Math.sin(a0)*inner, Math.cos(a0)*inner];
        const i0 = [x0, Math.sin(a0)*R,     Math.cos(a0)*R];
        const o1 = [x1, Math.sin(a1)*inner, Math.cos(a1)*inner];
        const i1 = [x1, Math.sin(a1)*R,     Math.cos(a1)*R];
        positions.push(...o0, ...i0, ...i1);
        positions.push(...o0, ...i1, ...o1);
      }
      const fg = new THREE.BufferGeometry();
      fg.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      fg.computeVertexNormals();
      const flight = new THREE.Mesh(fg, mat(STAGE_META.screw.color, {side:THREE.DoubleSide, metalness:0.5}));
      groups.screw.add(flight);
      if(!sc.shaftless && shaftD){
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(shaftD/2, shaftD/2, L*0.98, 16), mat(0xcfd4d8, {metalness:0.7, roughness:0.3}));
        shaft.rotation.z = Math.PI/2;
        groups.screw.add(shaft);
      }
      built.screw_diameter_in = D;
      built.screw_pitch_in = pitch;
      if(!pitchIsDirect) approx.push('screw pitch (standard pitch assumed = diameter)');
    }else{
      approx.push('screw (no diameter found -- omitted)');
    }

    // ---- Hanger bearings: at called-out positions when given ----
    let hangerPositions = Array.isArray(hg.positions_in) ? hg.positions_in.filter(p=>isFinite(Number(p))).map(Number) : [];
    const hSpacing = dimIn(hg.hanger_spacing);
    const hCount = (hg.count!=null && isFinite(Number(hg.count))) ? Number(hg.count) : null;
    if(!hangerPositions.length && hSpacing){
      for(let x=hSpacing; x < L; x+=hSpacing) hangerPositions.push(x);
    }else if(!hangerPositions.length && hCount){
      for(let i=1;i<=hCount;i++) hangerPositions.push(i*(L/(hCount+1)));
      approx.push('hanger positions (count known, spacing not called out -- evenly distributed)');
    }
    if(hangerPositions.length && D){
      const R = D/2;
      hangerPositions.forEach(px=>{
        const hanger = new THREE.Group();
        const yoke = new THREE.Mesh(new THREE.BoxGeometry(Math.max(R*0.12,0.5), R*2.0, Math.max(R*0.2,0.75)), mat(STAGE_META.bearings.color));
        yoke.position.y = R*0.5;
        const bore = dimIn(hg.bearing_bore);
        const brgR = bore ? bore*0.9 : R*0.26;
        if(!bore) approx.push('hanger bearing size');
        const brg = new THREE.Mesh(new THREE.CylinderGeometry(brgR, brgR, Math.max(R*0.3,1), 16), mat(STAGE_META.bearings.color, {metalness:0.6}));
        brg.rotation.z = Math.PI/2;
        hanger.add(yoke, brg);
        hanger.position.x = -L/2 + px;   // measured from tail end, per the spec
        groups.bearings.add(hanger);
      });
      built.hanger_count = hangerPositions.length;
      built.hanger_positions_in = hangerPositions;
    }else if(hCount || hSpacing){
      approx.push('hanger bearings (insufficient dimensions to place)');
    }

    // ---- Drive end / tail end ----
    const R = D ? D/2 : (troughW ? troughW/2 : null);
    if(R){
      const driveAtHead = (dr.location||'head') !== 'tail';
      const dx = driveAtHead ? L/2 : -L/2;
      const sgn = driveAtHead ? 1 : -1;
      const plate = new THREE.Mesh(new THREE.BoxGeometry(Math.max(R*0.15,0.5), R*2.6, R*2.6), mat(STAGE_META.drive.color));
      plate.position.x = dx + sgn*Math.max(R*0.08,0.3);
      groups.drive.add(plate);
      const sprD = dimIn(dr.sprocket_diameter);
      if(sprD){
        const spr = new THREE.Mesh(new THREE.CylinderGeometry(sprD/2, sprD/2, Math.max(R*0.2,0.6), 20), mat(STAGE_META.drive.color, {metalness:0.6}));
        spr.rotation.z = Math.PI/2;
        spr.position.x = dx + sgn*Math.max(R*0.5,2);
        groups.drive.add(spr);
        built.sprocket_diameter_in = sprD;
      }else{
        // Motor/gearbox shown only as an explicitly-approximate block.
        const motor = new THREE.Mesh(new THREE.BoxGeometry(R*1.4, R*1.4, R*1.2), ghost(STAGE_META.drive.color));
        motor.position.set(dx + sgn*R*1.0, R*1.2, 0);
        groups.drive.add(motor);
        approx.push('drive unit (identified, dimensions unavailable -- shown as placeholder)');
      }
      const tsd = dimIn(tl.shaft_diameter) || shaftD;
      const tailPlate = new THREE.Mesh(new THREE.BoxGeometry(Math.max(R*0.15,0.5), R*2.4, R*2.4), mat(STAGE_META.tail.color));
      tailPlate.position.x = -dx - sgn*Math.max(R*0.08,0.3);
      groups.tail.add(tailPlate);
      if(tsd){
        const ts = new THREE.Mesh(new THREE.CylinderGeometry(tsd/2, tsd/2, Math.max(R*0.9,3), 14), mat(0xcfd4d8, {metalness:0.7}));
        ts.rotation.z = Math.PI/2;
        ts.position.x = -dx - sgn*Math.max(R*0.5,2);
        groups.tail.add(ts);
      }else{
        approx.push('tail shaft (dimensions unavailable)');
      }
    }
  }else{
    // ---- Belt conveyor path ----
    const W = OW || dimIn(fr.frame_width);
    const beltW = dimIn((spec.belt||{}).belt_width);
    const hpD = dimIn(((spec.head||{}).pulley||{}).pulley_diameter);
    const hpW = dimIn(((spec.head||{}).pulley||{}).pulley_width);
    const frH = dimIn(fr.frame_height);
    if(W){
      const railH = dimIn(fr.side_rail_height) || Math.max(W*0.12, 2);
      if(!dimIn(fr.side_rail_height)) approx.push('side rail height');
      [-1,1].forEach(s=>{
        const rail = new THREE.Mesh(new THREE.BoxGeometry(L, railH, Math.max(W*0.04,0.5)), mat(STAGE_META.trough.color));
        rail.position.z = s*W/2;
        groups.trough.add(rail);
      });
      built.frame_width_in = W;
    }else approx.push('frame (no width found -- omitted)');
    if(hpD && W){
      const hp = new THREE.Mesh(new THREE.CylinderGeometry(hpD/2, hpD/2, hpW||W, 24), mat(STAGE_META.drive.color, {metalness:0.6}));
      hp.rotation.x = Math.PI/2;
      hp.position.x = L/2 - hpD/2;
      groups.drive.add(hp);
      built.head_pulley_diameter_in = hpD;
      if(!hpW) approx.push('head pulley width (frame width used)');
    }
    if(beltW && W){
      const belt = new THREE.Mesh(new THREE.BoxGeometry(L, Math.max(dimIn((spec.belt||{}).belt_thickness)||0.4,0.25), beltW), mat(0x2c3137, {roughness:0.9}));
      belt.position.y = (frH? frH/2 : 0);
      groups.screw.add(belt);
      built.belt_width_in = beltW;
    }
    const rs = dimIn((spec.idlers||{}).roller_spacing), rd = dimIn((spec.idlers||{}).roller_diameter);
    if(rs && rd && W){
      for(let x=rs; x<L; x+=rs){
        const r = new THREE.Mesh(new THREE.CylinderGeometry(rd/2, rd/2, W*0.92, 14), mat(STAGE_META.bearings.color));
        r.rotation.x = Math.PI/2;
        r.position.x = -L/2 + x;
        groups.bearings.add(r);
      }
      built.roller_spacing_in = rs;
    }
  }

  // ---- Legs at called-out positions ----
  const legPositions = Array.isArray(fr.leg_positions_in) ? fr.leg_positions_in.filter(p=>isFinite(Number(p))).map(Number) : [];
  const legSpacing = dimIn(fr.leg_spacing);
  const frameH = dimIn(fr.frame_height) || dimIn(o.centerline_height) || dimIn(o.elevation);
  let legs = legPositions;
  if(!legs.length && legSpacing){ for(let x=legSpacing; x<L; x+=legSpacing) legs.push(x); }
  if(legs.length && frameH){
    const halfW = (OW||troughW||12)/2;
    legs.forEach(px=>{
      [-1,1].forEach(s=>{
        const leg = new THREE.Mesh(new THREE.BoxGeometry(Math.max(halfW*0.12,1), frameH, Math.max(halfW*0.12,1)), mat(STAGE_META.other.color));
        leg.position.set(-L/2+px, -frameH/2, s*halfW*0.85);
        groups.other.add(leg);
      });
    });
    built.leg_positions_in = legs;
  }else if(legSpacing || legPositions.length){
    approx.push('legs (no frame height / elevation found -- omitted)');
  }

  // ---- Dimension overlays, straight from the spec ----
  const dimLabels = [];
  const addDim = (label, pos) => {
    const spr = makeTextSprite(THREE, label);
    const s = Math.max(L*0.045, 2);
    spr.scale.set(s*spr.userData.aspect, s, 1);
    spr.position.copy(pos);
    dimGroup.add(spr);
    dimLabels.push(spr);
  };
  const halfH = (troughW||OW||12)/2;
  addDim(`${L.toFixed(0)}" overall length`, new THREE.Vector3(0, -halfH*2.2, 0));
  if(troughW) addDim(`${troughW.toFixed(0)}" trough width`, new THREE.Vector3(-L/2, halfH*1.6, 0));
  if(D) addDim(`${D.toFixed(0)}" screw dia`, new THREE.Vector3(0, halfH*1.9, 0));
  if(inclineDeg) addDim(`${inclineDeg}deg incline`, new THREE.Vector3(L/2, halfH*1.6, 0));
  if(built.hanger_count) addDim(`${built.hanger_count} hangers`, new THREE.Vector3(0, -halfH*1.6, 0));
  dimGroup.visible = showDimensions;

  // Assembly mode hides the detail-heavy groups for a cleaner read.
  function applyMode(){
    const eng = modelMode === MODEL_MODES.engineering;
    groups.bearings.visible = eng && !hiddenModelParts.bearings;
    groups.other.visible    = eng && !hiddenModelParts.other;
    STAGE_ORDER.forEach(s=>{
      if(s!=='bearings' && s!=='other') groups[s].visible = !hiddenModelParts[s];
    });
  }
  applyMode();

  // ---- Framing + orbit ----
  let theta=-0.6, phi=1.15, dist=L*1.45+24;
  function applyCamera(){
    camera.position.set(dist*Math.sin(phi)*Math.cos(theta), dist*Math.cos(phi), dist*Math.sin(phi)*Math.sin(theta));
    camera.lookAt(0,0,0);
  }
  applyCamera();
  const el = renderer.domElement;
  let dragging=false,lastX=0,lastY=0,pinchStart=0,distStart=0;
  el.addEventListener('pointerdown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e=>{
    if(!dragging) return;
    theta -= (e.clientX-lastX)*0.01;
    phi = Math.max(0.15, Math.min(Math.PI-0.15, phi-(e.clientY-lastY)*0.01));
    lastX=e.clientX; lastY=e.clientY; applyCamera();
  });
  el.addEventListener('pointerup', ()=>{dragging=false;});
  el.addEventListener('pointercancel', ()=>{dragging=false;});
  el.addEventListener('wheel', e=>{ e.preventDefault(); dist=Math.max(L*0.15,Math.min(L*6+100, dist*(1+Math.sign(e.deltaY)*0.12))); applyCamera(); }, {passive:false});
  el.addEventListener('touchstart', e=>{ if(e.touches.length===2){ pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); distStart=dist; } }, {passive:true});
  el.addEventListener('touchmove', e=>{
    if(e.touches.length===2 && pinchStart){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      dist=Math.max(L*0.15,Math.min(L*6+100, distStart*(pinchStart/d))); applyCamera();
    }
  }, {passive:true});

  modelState = { renderer, scene, camera, groups, dimGroup, applyMode, raf:0 };
  lastBuildRecord = { built, approx };
  (function loop(){
    if(!modelState) return;
    modelState.raf = requestAnimationFrame(loop);
    dimLabels.forEach(s=>s.quaternion.copy(camera.quaternion));
    renderer.render(scene, camera);
  })();
}

function toggleModelPart(part){
  hiddenModelParts[part] = !hiddenModelParts[part];
  if(modelState && modelState.groups[part]) modelState.groups[part].visible = !hiddenModelParts[part];
  document.querySelectorAll(`[data-action="toggle-model-part"][data-part="${part}"]`).forEach(el=>{
    el.classList.toggle('dim', !!hiddenModelParts[part]);
  });
}

/* ---------------- Fullscreen blueprint viewer ----------------
   Pinch/drag to inspect the actual drawing -- the practical everyday
   need on a shop floor, where the detail you want is usually smaller
   than a phone screen shows at fit-width. */
function openBlueprintFullscreen(jobId){
  const job = state.jobs.find(j=>j.id===jobId);
  const b64 = blueprintImageCache[jobId];
  if(!job || !b64) return;
  const root = document.getElementById('modalRoot');
  const prevHtml = root.innerHTML;
  const prevRefresh = modalRefresh;

  const holder = document.createElement('div');
  holder.className = 'bp-fullscreen';
  holder.innerHTML = `
    <div class="bp-fs-bar">
      <span class="bp-fs-title">${escapeHtml(job.jobNumber)} Blueprint</span>
      <button class="btn btn-outline btn-sm" id="bpFsClose">Close</button>
    </div>
    <div class="bp-fs-stage" id="bpFsStage">
      <img class="bp-fs-img" id="bpFsImg" src="data:image/jpeg;base64,${b64}" alt="Blueprint">
      <div class="bp-fs-hint">Pinch to zoom &middot; drag to pan &middot; double-tap to reset</div>
    </div>`;
  document.body.appendChild(holder);

  const stage = holder.querySelector('#bpFsStage');
  const img = holder.querySelector('#bpFsImg');
  let scale=1, tx=0, ty=0, baseScale=1;
  function apply(){ img.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }
  function fit(){
    const sw = stage.clientWidth, sh = stage.clientHeight;
    const iw = img.naturalWidth || sw, ih = img.naturalHeight || sh;
    baseScale = Math.min(sw/iw, sh/ih);
    scale = baseScale;
    tx = (sw - iw*scale)/2;
    ty = (sh - ih*scale)/2;
    apply();
  }
  if(img.complete) fit(); else img.onload = fit;

  let dragging=false, lastX=0, lastY=0, pinchStart=0, scaleStart=1, lastTap=0;
  stage.addEventListener('pointerdown', e=>{
    dragging=true; lastX=e.clientX; lastY=e.clientY;
    const now=Date.now();
    if(now-lastTap < 300){ fit(); dragging=false; }
    lastTap=now;
  });
  stage.addEventListener('pointermove', e=>{
    if(!dragging) return;
    tx += e.clientX-lastX; ty += e.clientY-lastY;
    lastX=e.clientX; lastY=e.clientY;
    apply();
  });
  stage.addEventListener('pointerup', ()=>{ dragging=false; });
  stage.addEventListener('pointercancel', ()=>{ dragging=false; });
  stage.addEventListener('wheel', e=>{
    e.preventDefault();
    const f = 1 - Math.sign(e.deltaY)*0.15;
    const nx = e.clientX - stage.getBoundingClientRect().left;
    const ny = e.clientY - stage.getBoundingClientRect().top;
    tx = nx - (nx-tx)*f; ty = ny - (ny-ty)*f;
    scale = Math.max(baseScale*0.5, Math.min(baseScale*12, scale*f));
    apply();
  }, {passive:false});
  stage.addEventListener('touchstart', e=>{
    if(e.touches.length===2){
      pinchStart = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      scaleStart = scale;
      dragging = false;
    }
  }, {passive:true});
  stage.addEventListener('touchmove', e=>{
    if(e.touches.length===2 && pinchStart){
      const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      const rect = stage.getBoundingClientRect();
      const cx = (e.touches[0].clientX+e.touches[1].clientX)/2 - rect.left;
      const cy = (e.touches[0].clientY+e.touches[1].clientY)/2 - rect.top;
      const ns = Math.max(baseScale*0.5, Math.min(baseScale*12, scaleStart*(d/pinchStart)));
      const f = ns/scale;
      tx = cx - (cx-tx)*f; ty = cy - (cy-ty)*f;
      scale = ns;
      apply();
    }
  }, {passive:true});

  holder.querySelector('#bpFsClose').addEventListener('click', ()=>{
    document.body.removeChild(holder);
    root.innerHTML = prevHtml;
    modalRefresh = prevRefresh;
  });
}

function jobDetailModalHtml(job){
  const ds = dueStatus(job);
  const du = daysUntil(job.dueDate);
  const dueText = ds==='complete' ? 'Complete' : ds==='overdue' ? `${Math.abs(du)}d overdue` : du===0 ? 'Due today' : `Due in ${du}d`;
  const idx = STAGES.findIndex(s=>s.id===job.assemblyStatus);
  const nextStage = STAGES[idx+1];
  const stageProgress = stageChecklistProgress(job, job.assemblyStatus);
  const stepIdxs = STAGE_PROCEDURE[job.assemblyStatus] || [];

/* ================================================================
   ENGINEERING SPECIFICATION LAYER
   The AI's only job is to read the drawing and fill this structure in.
   It never produces geometry. Everything below -- normalization,
   validation, and the 3D build -- is deterministic application code
   working from these numbers.
   ================================================================ */

// Every dimension carries provenance so nothing is silently invented.
// {value, unit, normalized_in, source_page, source, description,
//  confidence, method: 'direct'|'inferred', status: 'ok'|'not_found'}
const UNIT_TO_IN = { in:1, inch:1, inches:1, '"':1, ft:12, foot:12, feet:12, "'":12, mm:1/25.4, cm:1/2.54, m:39.3701 };

function normDim(d){
  if(d == null) return { value:null, unit:null, normalized_in:null, confidence:0, status:'not_found', method:null, source_page:null, source:null };
  // Tolerate the AI returning a bare number instead of the full object.
  if(typeof d === 'number' || typeof d === 'string'){
    const n = Number(d);
    return isFinite(n)
      ? { value:n, unit:'in', normalized_in:n, confidence:0.5, status:'ok', method:'inferred', source_page:null, source:null, description:null }
      : { value:null, unit:null, normalized_in:null, confidence:0, status:'not_found', method:null, source_page:null, source:null };
  }
  const raw = (d.value!=null && d.value!=='' && isFinite(Number(d.value))) ? Number(d.value) : null;
  if(raw === null) return { value:null, unit:null, normalized_in:null, confidence:0, status:d.status||'not_found', method:null, source_page:d.source_page??null, source:d.source||null, description:d.description||null };
  const unit = (d.unit || 'in').toString().toLowerCase().trim();
  const factor = UNIT_TO_IN[unit] != null ? UNIT_TO_IN[unit] : 1;
  return {
    value: raw,
    unit: d.unit || 'in',
    normalized_in: raw * factor,
    normalized_mm: raw * factor * 25.4,
    original_text: d.original_text || `${raw}${d.unit||''}`,
    source_page: d.source_page ?? null,
    source: d.source || null,
    description: d.description || null,
    confidence: (d.confidence!=null && isFinite(Number(d.confidence))) ? Number(d.confidence) : 0.5,
    method: d.method === 'direct' ? 'direct' : 'inferred',
    status: 'ok'
  };
}
const dimIn = d => (d && d.status==='ok' && d.normalized_in!=null) ? d.normalized_in : null;
function confLabel(d){
  if(!d || d.status!=='ok' || d.normalized_in==null) return 'NOT FOUND';
  if(d.conflict) return 'CONFLICT';
  if(d.method==='inferred') return d.confidence>=0.7 ? 'INFERRED' : 'LOW';
  if(d.confidence>=0.85) return 'HIGH';
  if(d.confidence>=0.6) return 'MEDIUM';
  return 'LOW';
}

// Walks whatever the AI returned and normalizes every dimension node in
// place, leaving non-dimension fields untouched.
const DIM_KEYS = new Set([
  'overall_length','overall_width','overall_height','elevation','incline_angle',
  'trough_width','trough_depth','trough_gauge','flange_height','screw_diameter',
  'screw_pitch','shaft_diameter','shaft_length','coupling_diameter','flight_thickness',
  'frame_height','frame_width','side_rail_height','side_rail_thickness','leg_spacing',
  'pulley_diameter','pulley_width','bearing_bore','sprocket_diameter','belt_width',
  'belt_thickness','roller_diameter','roller_width','roller_spacing','hanger_spacing',
  'inlet_length','outlet_length','centerline_height','take_up_travel'
]);
function normalizeSpecTree(node){
  if(!node || typeof node !== 'object') return node;
  if(Array.isArray(node)) return node.map(normalizeSpecTree);
  const out = {};
  for(const [k,v] of Object.entries(node)){
    if(DIM_KEYS.has(k)) out[k] = normDim(v);
    else if(v && typeof v === 'object') out[k] = normalizeSpecTree(v);
    else out[k] = v;
  }
  return out;
}

function normalizeSpec(parsed){
  if(!parsed || typeof parsed !== 'object') return null;
  const spec = normalizeSpecTree(parsed);
  spec.conveyorType = ['screw','belt'].includes(spec.conveyorType) ? spec.conveyorType : 'screw';
  spec.pages_analyzed = Array.isArray(spec.pages_analyzed) ? spec.pages_analyzed : [];
  spec.conflicts = Array.isArray(spec.conflicts) ? spec.conflicts : [];
  spec.extractedAt = new Date().toISOString();
  // Usable only if we got at least one primary dimension -- otherwise the
  // generator would be building from nothing, which is the failure mode
  // this whole layer exists to prevent.
  const o = spec.overall || {};
  const hasPrimary = dimIn(o.overall_length) || dimIn(o.overall_width) ||
                     dimIn((spec.screw||{}).screw_diameter) || dimIn((spec.trough||{}).trough_width);
  return hasPrimary ? spec : null;
}

/* ---------------- Engineering validation ----------------
   Runs before any geometry is built. Never silently corrects -- it
   reports, and the geometry generator then refuses to invent anything
   that failed. */
function validateSpec(spec){
  const checks = [];
  const add = (level, message) => checks.push({ level, message });
  if(!spec){ return { checks:[{level:'error', message:'No usable specification extracted.'}], ok:false }; }

  const o = spec.overall || {};
  const L = dimIn(o.overall_length), W = dimIn(o.overall_width), H = dimIn(o.overall_height);

  if(!L) add('error','Overall length not found -- length-dependent geometry will be shown as approximate.');
  if(!W && !dimIn((spec.trough||{}).trough_width) && !dimIn((spec.screw||{}).screw_diameter))
    add('error','No width or diameter found -- cross-section will be approximate.');

  // Conflicts reported by the extractor across views.
  (spec.conflicts||[]).forEach(cf=>{
    add('conflict', typeof cf==='string' ? cf : `${cf.field||'Dimension'} conflict: ${cf.detail||JSON.stringify(cf)}`);
  });

  // Impossible / implausible geometry.
  if(L != null && L <= 0) add('error','Overall length is zero or negative.');
  if(W != null && L != null && W > L) add('warning',`Width (${W.toFixed(1)}") exceeds length (${L.toFixed(1)}") -- check units.`);

  const inc = dimIn(o.incline_angle) != null ? o.incline_angle.value : null;
  if(inc != null && (inc < 0 || inc > 90)) add('error',`Incline angle ${inc}deg is out of range.`);

  if(spec.conveyorType === 'screw'){
    const sd = dimIn((spec.screw||{}).screw_diameter);
    const tw = dimIn((spec.trough||{}).trough_width);
    if(sd && tw && sd > tw) add('warning',`Screw diameter (${sd.toFixed(1)}") is larger than trough width (${tw.toFixed(1)}").`);
    const shaft = dimIn((spec.screw||{}).shaft_diameter);
    if(shaft && sd && shaft >= sd) add('error',`Shaft diameter (${shaft.toFixed(1)}") is not smaller than screw diameter (${sd.toFixed(1)}").`);
    const hangers = (spec.hangers && spec.hangers.count!=null) ? Number(spec.hangers.count) : null;
    const hs = dimIn((spec.hangers||{}).hanger_spacing);
    if(hangers != null && L && hs && (hangers+1)*hs > L*1.25)
      add('warning',`Hanger count (${hangers}) and spacing (${hs.toFixed(1)}") exceed overall length.`);
  }else{
    const bw = dimIn((spec.belt||{}).belt_width);
    const hp = dimIn(((spec.head||{}).pulley||{}).pulley_width);
    if(bw && hp && bw > hp) add('warning',`Belt width (${bw.toFixed(1)}") exceeds head pulley width (${hp.toFixed(1)}").`);
    if(bw && W && bw > W) add('warning',`Belt width (${bw.toFixed(1)}") exceeds frame width (${W.toFixed(1)}").`);
  }

  // Unit sanity: anything absurdly large usually means mm read as inches.
  [['overall length',L],['overall width',W],['overall height',H]].forEach(([n,v])=>{
    if(v != null && v > 2400) add('warning',`${n} normalizes to ${v.toFixed(0)}" (>200ft) -- possible unit error.`);
  });

  const errors = checks.filter(c=>c.level==='error').length;
  const conflicts = checks.filter(c=>c.level==='conflict').length;
  return { checks, ok: errors===0 && conflicts===0, errors, conflicts,
           warnings: checks.filter(c=>c.level==='warning').length };
}
async function extractComponents(jobId){
  const job = state.jobs.find(j=>j.id===jobId);
  if(!job || !selectedBlueprintFile) return;
  const file = selectedBlueprintFile;
  const btn = document.getElementById('bpExtractBtn');
  const resultArea = document.getElementById('bpResultArea');
  if(btn){ btn.disabled = true; btn.textContent = 'Reading blueprint...'; }
  if(resultArea) resultArea.innerHTML = `<div class="empty-state"><div class="big">&#8987;</div>Analyzing drawing...</div>`;

  try{
    let contentBlocks = [];
    let primaryImageBase64 = null;
    if(file.type === 'application/pdf'){
      const images = await pdfFileToImages(file);
      if(!images.length) throw new Error('The PDF has no readable pages.');
      contentBlocks = images.map(img=>({type:'image', source:{type:'base64', media_type:img.mime, data:img.base64}}));
      primaryImageBase64 = images[0].base64;
    }else{
      const {base64, mime} = await fileToImageBase64Resized(file);
      contentBlocks = [{type:'image', source:{type:'base64', media_type:mime, data:base64}}];
      primaryImageBase64 = base64;
    }

    const systemPrompt = buildSpecPrompt(false);

    const content = [...contentBlocks, {type:'text', text:'Read this complete drawing set and return the unified engineering specification JSON.'}];
    let text = await callClaudeAPI(systemPrompt, content);
    text = text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    let parsed = {};
    try{ parsed = JSON.parse(text); }catch(e){ parsed = {}; }
    const list = normalizeComponents(parsed);
    const spec = normalizeSpec(parsed);
    const validation = spec ? validateSpec(spec) : null;
    if(spec) job.spec = spec;
    if(validation) job.validation = validation;
    job.geometry = spec ? specToLegacyGeometry(spec) : job.geometry;

    job.billOfMaterials = list;
    if(geometry) job.geometry = geometry;
    job.blueprintExtractedAt = new Date().toISOString();
    await persistJobs();

    saveBlueprintImage(job.id, primaryImageBase64).then(ok=>{
      if(ok){ job.hasBlueprintImage = true; delete blueprintImageCache[job.id]; persistJobs(); refreshOpenModal(); }
    });

    if(resultArea) resultArea.innerHTML = bomListHtml(job);
    if(btn){ btn.disabled = false; btn.textContent = 'Re-Extract from New Photo'; }
    logActivity('Blueprint scanned', `${job.jobNumber}: ${list.length} components extracted`);
    showToast(list.length ? `Extracted ${list.length} components` : 'No components identified -- try a clearer photo');
    render();
  }catch(err){
    console.error(err);
    const detail = explainFetchError(err);
    if(resultArea) resultArea.innerHTML = `<div class="empty-state"><div class="big">&#9888;</div>Could not read the blueprint.<br><span style="font-size:11px;color:var(--text-faint);">${escapeHtml(detail)}</span></div>`;
    if(btn){ btn.disabled = false; btn.textContent = 'Extract Components'; }
  }
}

}
function openNewJobBlueprintModal(){
  selectedBlueprintFile = null;
  openModal(newJobBlueprintModalHtml());
}
async function extractNewJobFromBlueprint(){
  if(!selectedBlueprintFile) return;
  const file = selectedBlueprintFile;
  const btn = document.getElementById('bpExtractBtn');
  const resultArea = document.getElementById('bpResultArea');
  if(btn){ btn.disabled = true; btn.textContent = 'Reading blueprint...'; }
  if(resultArea) resultArea.innerHTML = `<div class="empty-state"><div class="big">&#8987;</div>Analyzing drawing...</div>`;

  try{
    let contentBlocks = [];
    let primaryImageBase64 = null;
    if(file.type === 'application/pdf'){
      const images = await pdfFileToImages(file);
      if(!images.length) throw new Error('The PDF has no readable pages.');
      contentBlocks = images.map(img=>({type:'image', source:{type:'base64', media_type:img.mime, data:img.base64}}));
      primaryImageBase64 = images[0].base64;
    }else{
      const {base64, mime} = await fileToImageBase64Resized(file);
      contentBlocks = [{type:'image', source:{type:'base64', media_type:mime, data:base64}}];
      primaryImageBase64 = base64;
    }

    const systemPrompt = buildSpecPrompt(true);

    const content = [...contentBlocks, {type:'text', text:'Read this complete drawing set and return the unified engineering specification JSON.'}];
    let text = await callClaudeAPI(systemPrompt, content);
    text = text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    let parsed = {};
    try{ parsed = JSON.parse(text); }catch(e){ parsed = {}; }
    const components = normalizeComponents(parsed);
    const spec = normalizeSpec(parsed);
    const validation = spec ? validateSpec(spec) : null;
    const geometry = spec ? specToLegacyGeometry(spec) : null;

    // Generate the job's id now (instead of at save time) so the blueprint
    // image can be uploaded under it right away and be there once the job
    // itself is saved from the pre-filled form.
    const pendingId = uid('job');
    const imageSaved = await saveBlueprintImage(pendingId, primaryImageBase64);

    const prefill = {
      id: pendingId,
      jobNumber: parsed.jobNumber ? String(parsed.jobNumber) : '',
      customer: parsed.customer ? String(parsed.customer) : '',
      description: parsed.description ? String(parsed.description) : '',
      billOfMaterials: components,
      geometry: geometry,
      spec: spec,
      validation: validation,
      blueprintExtractedAt: new Date().toISOString(),
      hasBlueprintImage: imageSaved
    };

    closeModal();
    openJobForm(null, prefill);
    showToast(components.length ? `Read the blueprint -- found ${components.length} components. Review and save.` : 'Read the blueprint, but found no components -- fill in details manually.');
  }catch(err){
    console.error(err);
    const detail = explainFetchError(err);
    if(resultArea) resultArea.innerHTML = `<div class="empty-state"><div class="big">&#9888;</div>Could not read the blueprint.<br><span style="font-size:11px;color:var(--text-faint);">${escapeHtml(detail)}</span></div>`;
    if(btn){ btn.disabled = false; btn.textContent = 'Read Blueprint & Create Job'; }
  }
}

/* ================= EVENT DELEGATION ================= */
document.addEventListener('click', e=>{
  const btn = e.target.closest('[data-action]');
  const tabBtn = e.target.closest('.tab-btn');
  if(tabBtn){
    state.tab = tabBtn.getAttribute('data-tab');
    render();
    window.scrollTo(0,0);
    return;
  }
  if(!btn) return;
  const action = btn.getAttribute('data-action');
  const id = btn.getAttribute('data-id');

  switch(action){
    case 'open-settings':
      openSettingsModal();
      break;
    case 'clear-api-key':
      setApiKey('');
      closeModal();
      showToast('API key removed');
      break;
    case 'clear-openrouter-key':
      setOpenRouterKey('');
      closeModal();
      showToast('OpenRouter key removed');
      break;
    case 'set-ai-provider':
      setAiProvider(btn.getAttribute('data-provider'));
      openSettingsModal(); // re-render so the right key section shows
      break;
    case 'refresh-activity':
      loadActivity();
      showToast('Activity refreshed');
      break;
    case 'manual-sync':
      reloadFromStorage(true);
      break;
    case 'goto-filter':
      state.tab = 'dashboard';
      state.jobFilter = btn.getAttribute('data-filter');
      render();
      window.scrollTo(0,0);
      break;
    case 'filter-jobs':
      state.jobFilter = btn.getAttribute('data-filter');
      document.querySelectorAll('#jobFilterChips .chip').forEach(c=>c.classList.toggle('active', c.getAttribute('data-filter')===state.jobFilter));
      updateDashboardList();
      break;
    case 'filter-blockers':
      state.blockerFilter = btn.getAttribute('data-filter');
      document.querySelectorAll('#blockerFilterChips .chip').forEach(c=>c.classList.toggle('active', c.getAttribute('data-filter')===state.blockerFilter));
      updateBlockersList();
      break;
    case 'new-job':
      openJobForm(null);
      break;
    case 'new-job-from-blueprint':
      openNewJobBlueprintModal();
      break;
    case 'edit-job':
      openJobForm(id);
      break;
    case 'open-job-detail':
      openJobDetail(id);
      break;
    case 'delete-job': {
      const job = state.jobs.find(j=>j.id===id);
      if(job && confirm(`Delete job ${job.jobNumber}? This cannot be undone.`)){
        state.jobs = state.jobs.filter(j=>j.id!==id);
        persistJobs();
        logActivity('Job deleted', `${job.jobNumber} (${job.customer})`);
        closeModal();
        showToast('Job deleted');
        render();
      }
      break;
    }
    case 'attempt-advance':
      attemptAdvance(id);
      break;
    case 'report-blocker':
      openBlockerForm(btn.getAttribute('data-jobnumber'));
      break;
    case 'new-blocker':
      openBlockerForm(null);
      break;
    case 'delete-blocker': {
      const delBlk = state.blockers.find(b=>b.id===id);
      state.blockers = state.blockers.filter(b=>b.id!==id);
      persistBlockers();
      if(delBlk) logActivity('Blocker deleted', `${delBlk.jobNumber}: ${delBlk.issueDescription}`);
      showToast('Blocker deleted');
      render();
      break;
    }
    case 'cycle-blocker-status': {
      const b = state.blockers.find(b=>b.id===id);
      if(b){
        const order = ['Open','In Progress','Resolved'];
        const next = order[(order.indexOf(b.status)+1) % order.length];
        b.status = next;
        persistBlockers();
        logActivity('Blocker status changed', `${b.jobNumber}: ${next} -- ${b.issueDescription}`);
        showToast(`Status: ${next}`);
        render();
      }
      break;
    }
    case 'new-note':
      openNoteForm(null);
      break;
    case 'stage-prev':
      stepStage(id, -1);
      break;
    case 'open-mover':
      openMover(id);
      break;
    case 'pick-stage':
      moveJobToStage(id, btn.getAttribute('data-stage'));
      closeModal();
      break;
    case 'quick-prompt':
      sendChat(btn.getAttribute('data-prompt'));
      break;
    case 'send-chat':
      sendChat();
      break;
    case 'copy-msg': {
      const idx = parseInt(btn.getAttribute('data-index'),10);
      const msg = state.chat[idx];
      if(msg) copyToClipboard(msg.text);
      break;
    }
    case 'ask-ai-focus':
      goToAssistantWithPrompt('What should the team focus on today?');
      break;
    case 'open-blueprint-fullscreen':
      openBlueprintFullscreen(id);
      break;
    case 'set-model-mode':
      modelMode = btn.getAttribute('data-mode')==='assembly' ? MODEL_MODES.assembly : MODEL_MODES.engineering;
      if(modelState && modelState.applyMode) modelState.applyMode();
      document.querySelectorAll('[data-action="set-model-mode"]').forEach(el=>{
        el.classList.toggle('active', el.getAttribute('data-mode')===modelMode);
      });
      break;
    case 'toggle-dimensions':
      showDimensions = !showDimensions;
      if(modelState && modelState.dimGroup) modelState.dimGroup.visible = showDimensions;
      btn.classList.toggle('active', showDimensions);
      break;
    case 'show-verification': {
      const vjob = state.jobs.find(j=>j.id===id);
      if(vjob){
        const prev = modalRefresh, prevHtml = document.getElementById('modalRoot').innerHTML;
        disposeModel();
        document.getElementById('modalRoot').innerHTML =
          `<div class="modal-overlay" data-close-overlay>${verificationReportHtml(vjob)}</div>`;
        modalRefresh = ()=>verificationReportHtml(vjob);
      }
      break;
    }
    case 'toggle-model-part':
      toggleModelPart(btn.getAttribute('data-part'));
      break;
    case 'open-blueprint':
      openBlueprintModal(id);
      break;
    case 'extract-bom':
      extractComponents(id);
      break;
    case 'extract-new-job':
      extractNewJobFromBlueprint();
      break;
    case 'toggle-stage-checklist-item':
      toggleStageChecklistItem(id, btn.getAttribute('data-key'));
      break;
    case 'confirm-advance':
      confirmAdvance(id);
      break;
  }
});
document.addEventListener('change', e=>{
  if(e.target.id === 'bpFileInput'){
    const file = e.target.files[0];
    selectedBlueprintFile = file || null;
    const btn = document.getElementById('bpExtractBtn');
    const preview = document.getElementById('bpPreviewArea');
    if(!file){
      if(btn) btn.disabled = true;
      if(preview) preview.innerHTML = '';
      return;
    }
    if(btn){ btn.disabled = false; btn.textContent = 'Extract Components'; }
    if(preview){
      if(file.type === 'application/pdf'){
        preview.innerHTML = `<div class="bp-file-chip">&#128196; ${escapeHtml(file.name)}</div>`;
      }else{
        const url = URL.createObjectURL(file);
        preview.innerHTML = `<img src="${url}" class="bp-preview-img" alt="Blueprint preview">`;
      }
    }
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='dashSearch'){
    state.jobSearch = e.target.value;
    updateDashboardList();
  }else if(e.target.id==='noteSearch'){
    state.noteSearch = e.target.value;
    updateNotesList();
  }else if(e.target.id==='actSearch'){
    state.activitySearch = e.target.value;
    updateActivityList();
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.id==='chatInput'){
    e.preventDefault();
    sendChat();
  }
});

/* ================= RENDER ROUTER ================= */
function render(){
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-tab')===state.tab);
  });
  if(!supabaseReady()){
    document.getElementById('metricsStrip').innerHTML = '';
    document.getElementById('content').innerHTML = `
      <div class="focus-banner" style="margin-top:20px;">
        <div class="focus-banner-head">Setup Needed</div>
        <div style="font-size:13px;line-height:1.5;">
          This app isn't connected to its data store yet. If you're setting this up: create a Supabase project,
          set SUPABASE_URL and SUPABASE_ANON_KEY near the top of this file, then republish. If you're
          not the one who set this up, let them know this message is showing.
        </div>
      </div>`;
    return;
  }
  renderMetrics();
  if(state.tab==='dashboard') renderDashboard();
  else if(state.tab==='board') renderBoard();
  else if(state.tab==='blockers') renderBlockers();
  else if(state.tab==='notes') renderNotes();
  else if(state.tab==='assistant') renderAssistant();
  else if(state.tab==='activity') renderActivity();
}

function updateDateSub(){
  const el = document.getElementById('dateSub');
  const now = new Date();
  const hr = now.getHours();
  const shift = hr < 14 ? 'Day Shift' : hr < 22 ? 'Afternoon Shift' : 'Night Shift';
  el.textContent = `${shift} \u2014 ${now.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'})}`;
}

/* ================= INIT ================= */
(async function init(){
  updateDateSub();
  document.getElementById('content').innerHTML = `<div class="empty-state"><div class="big">&#8987;</div>Loading shop data...</div>`;
  await loadAll();
  render();
  ensureUserName();
})();
</script>
