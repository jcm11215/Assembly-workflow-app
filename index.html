<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Assembly Workflow Tracker</title>
<style>
:root{
  --steel-950:#0f1215;
  --steel-900:#181c20;
  --steel-800:#22262b;
  --steel-700:#2c3137;
  --steel-600:#3d434b;
  --line:#39404a;
  --text:#eef1f3;
  --text-dim:#98a1a9;
  --text-faint:#6b737b;
  --yellow:#f5b400;
  --yellow-ink:#3a2a00;
  --red:#e34b3a;
  --red-bg:#2e1613;
  --amber:#e2a13d;
  --amber-bg:#2e2210;
  --green:#4fae57;
  --green-bg:#132f16;
  --blue:#5aa3d8;
  --blue-bg:#12242f;
  --radius:10px;
  font-size:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--steel-950);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;}
::selection{background:var(--yellow);color:#1a1400;}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* ---------- App bar ---------- */
.appbar{
  background:var(--steel-900);
  border-bottom:3px solid var(--yellow);
  padding:10px 10px 10px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
  gap:8px;
}
.appbar .brand{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
.appbar .brand .name{
  font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text);
}
.appbar .brand .sub{font-size:11px;color:var(--text-dim);letter-spacing:.03em;margin-top:2px;}
.appbar .right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.appbar .stamp{
  background:var(--yellow);color:#241a00;font-weight:800;font-size:11px;letter-spacing:.06em;
  padding:6px 10px;border-radius:6px;text-transform:uppercase;white-space:nowrap;
}
.refresh-btn{
  background:var(--steel-800);border:1px solid var(--steel-600);color:var(--text);
  width:38px;height:38px;border-radius:8px;font-size:17px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.refresh-btn:active{background:var(--steel-700);}
.refresh-btn.spinning{animation:spin .7s linear;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

/* ---------- Metrics strip ---------- */
.metrics-strip{
  display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--steel-900);
  border-bottom:1px solid var(--line);flex-shrink:0;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.metrics-strip::-webkit-scrollbar{display:none;}
.metric-card{
  background:var(--steel-800);border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 14px;min-width:108px;flex-shrink:0;text-align:left;-webkit-appearance:none;cursor:pointer;
}
.metric-card:active{background:var(--steel-700);}
.metric-card .num{font-size:22px;font-weight:800;line-height:1;}
.metric-card .lbl{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-top:4px;}
.metric-card.m-red .num{color:var(--red);}
.metric-card.m-amber .num{color:var(--amber);}
.metric-card.m-green .num{color:var(--green);}
.metric-card.m-blue .num{color:var(--blue);}
.metric-card.m-yellow .num{color:var(--yellow);}

/* ---------- Main content ---------- */
main{flex:1;overflow-y:auto;padding:12px 12px 90px 12px;-webkit-overflow-scrolling:touch;}
.section-title{
  font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-dim);margin:14px 0 8px 0;display:flex;align-items:center;justify-content:space-between;
}
.section-title .count-badge{
  background:var(--steel-700);color:var(--text-dim);font-size:11px;padding:2px 7px;border-radius:20px;
}
.sticky-bar{position:sticky;top:0;background:var(--steel-950);z-index:5;padding-top:2px;padding-bottom:4px;}

/* ---------- Focus banner ---------- */
.focus-banner{
  background:var(--steel-800);border-left:4px solid var(--yellow);border-radius:var(--radius);
  padding:12px 12px 10px 12px;margin-bottom:12px;
}
.focus-banner-head{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--yellow);margin-bottom:8px;}
.focus-jobs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.focus-job-chip{
  background:var(--steel-700);border-radius:6px;padding:5px 9px;font-size:12px;font-weight:700;
  display:inline-flex;align-items:center;gap:6px;
}
.focus-job-chip .fd{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;}
.focus-calm{color:var(--green);font-size:13px;font-weight:600;margin-bottom:10px;}

/* ---------- Buttons ---------- */
.btn{
  border:none;border-radius:8px;font-weight:700;font-size:14px;padding:12px 16px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;
}
.btn-primary{background:var(--yellow);color:#241a00;}
.btn-primary:active{background:#d69d00;}
.btn-outline{background:transparent;border:1.5px solid var(--steel-600);color:var(--text);}
.btn-outline:active{background:var(--steel-800);}
.btn-danger{background:var(--red);color:#fff;}
.btn-ghost{background:var(--steel-800);color:var(--text);}
.btn-block{width:100%;}
.btn-sm{padding:9px 12px;font-size:12.5px;min-height:40px;}
.btn:disabled{background:var(--steel-700);color:var(--text-faint);cursor:not-allowed;}
.fab-row{display:flex;gap:8px;margin-top:6px;}

/* ---------- Filter chips ---------- */
.chip-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;background:var(--steel-800);border:1px solid var(--line);color:var(--text-dim);
  font-size:12px;font-weight:700;padding:10px 14px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;
  min-height:40px;-webkit-appearance:none;
}
.chip.active{background:var(--yellow);color:#241a00;border-color:var(--yellow);}

/* ---------- Job cards ---------- */
.job-card{
  background:var(--steel-800);border:1px solid var(--line);border-left:5px solid var(--steel-600);
  border-radius:var(--radius);padding:12px;margin-bottom:10px;position:relative;cursor:pointer;
}
.job-card.due-overdue{border-left-color:var(--red);background:linear-gradient(90deg,var(--red-bg),var(--steel-800) 40%);}
.job-card.due-soon{border-left-color:var(--amber);background:linear-gradient(90deg,var(--amber-bg),var(--steel-800) 40%);}
.job-card.due-ok{border-left-color:var(--green);}
.job-card.due-complete{border-left-color:var(--text-faint);opacity:.75;}
.job-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.job-num{font-weight:800;font-size:15px;letter-spacing:.02em;}
.job-cust{font-size:12px;color:var(--text-dim);margin-top:1px;}
.job-desc{font-size:13px;color:var(--text);margin-top:6px;line-height:1.4;}
.badge{
  font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  padding:3px 7px;border-radius:5px;border:1.5px solid currentColor;white-space:nowrap;
}
.badge-high{color:var(--red);}
.badge-medium{color:var(--amber);}
.badge-low{color:var(--blue);}
.job-meta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;color:var(--text-dim);}
.job-meta-row b{color:var(--text);font-weight:700;}
.due-tag{font-weight:800;text-transform:uppercase;font-size:10px;letter-spacing:.04em;}
.due-tag.due-overdue{color:var(--red);}
.due-tag.due-soon{color:var(--amber);}
.due-tag.due-ok{color:var(--green);}
.due-tag.due-complete{color:var(--text-faint);}

.gauge{margin-top:10px;}
.gauge-track{
  height:10px;border-radius:5px;background:var(--steel-700);
  background-image:repeating-linear-gradient(90deg,transparent,transparent calc(10% - 1px),var(--steel-900) 10%);
  overflow:hidden;position:relative;
}
.gauge-fill{height:100%;background:var(--yellow);border-radius:5px 0 0 5px;transition:width .2s;}
.gauge-label{font-size:10px;color:var(--text-dim);margin-top:3px;text-align:right;font-weight:700;}

.job-card-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;}
.job-card-actions .btn{flex:1;white-space:nowrap;}

/* ---------- Board ---------- */
.board-wrap{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;}
.board-col{
  flex:0 0 80vw;max-width:320px;scroll-snap-align:start;background:var(--steel-900);
  border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;max-height:100%;
}
.board-col-head{
  padding:10px 12px;border-bottom:2px solid var(--yellow);display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;background:var(--steel-900);border-radius:var(--radius) var(--radius) 0 0;
}
.board-col-head .t{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
.board-col-head .c{font-size:11px;color:var(--text-dim);background:var(--steel-800);padding:2px 8px;border-radius:20px;}
.board-col-body{padding:8px;overflow-y:auto;flex:1;min-height:120px;}
.board-col-body.drag-over{background:var(--steel-800);}
.board-card{
  background:var(--steel-800);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;
  cursor:grab;
}
.board-card:active{cursor:grabbing;}
.board-card .bn{font-weight:800;font-size:13px;}
.board-card .bc{font-size:11px;color:var(--text-dim);}
.board-card .ba{font-size:11px;color:var(--text-dim);margin-top:4px;}
.board-card-actions{display:flex;gap:6px;margin-top:8px;}
.icon-btn{
  background:var(--steel-700);border:none;color:var(--text);border-radius:6px;width:40px;height:40px;
  font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.move-btn{flex:1;background:var(--steel-700);border:none;color:var(--text);border-radius:6px;height:40px;font-size:11px;font-weight:700;text-transform:uppercase;}
.empty-col{color:var(--text-faint);font-size:12px;text-align:center;padding:16px 4px;}

/* ---------- Blockers ---------- */
.blocker-card{
  background:var(--steel-800);border:1px solid var(--line);border-left:5px solid var(--red);
  border-radius:var(--radius);padding:12px;margin-bottom:10px;
}
.blocker-card.resolved{border-left-color:var(--green);opacity:.7;}
.blocker-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.sev-badge{font-size:10px;font-weight:800;text-transform:uppercase;padding:3px 7px;border-radius:5px;color:#fff;flex-shrink:0;}
.sev-critical{background:var(--red);}
.sev-high{background:#b5502f;}
.sev-medium{background:var(--amber);color:#241a00;}
.sev-low{background:var(--steel-600);}
.status-pill{font-size:10px;font-weight:800;text-transform:uppercase;padding:5px 9px;border-radius:20px;border:1.5px solid currentColor;}
.status-open{color:var(--red);}
.status-inprogress{color:var(--amber);}
.status-resolved{color:var(--green);}

/* ---------- Notes ---------- */
.note-card{background:var(--steel-800);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;}
.note-head{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-bottom:6px;}
.note-type-tag{font-size:10px;font-weight:800;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-right:6px;}
.note-progress{background:var(--blue-bg);color:var(--blue);}
.note-issue{background:var(--red-bg);color:var(--red);}
.note-next{background:var(--green-bg);color:var(--green);}
.note-body{font-size:13px;line-height:1.45;}
.note-author{font-size:11px;color:var(--text-faint);margin-top:6px;font-style:italic;}

/* ---------- Activity log ---------- */
.act-row{
  background:var(--steel-800);border:1px solid var(--line);border-left:3px solid var(--steel-600);
  border-radius:8px;padding:10px 12px;margin-bottom:8px;
}
.act-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px;}
.act-who{font-size:12px;font-weight:800;color:var(--yellow);}
.act-when{font-size:10px;color:var(--text-faint);white-space:nowrap;}
.act-action{font-size:12px;font-weight:700;}
.act-detail{font-size:12px;color:var(--text-dim);margin-top:2px;line-height:1.4;word-break:break-word;}

/* ---------- Forms / Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;
  z-index:200;
}
.modal-sheet{
  background:var(--steel-900);border-top:3px solid var(--yellow);border-radius:16px 16px 0 0;
  width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
}
.modal-title{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.modal-close{background:var(--steel-800);border:none;color:var(--text);width:36px;height:36px;border-radius:8px;font-size:16px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;background:var(--steel-800);border:1.5px solid var(--steel-600);color:var(--text);
  border-radius:8px;padding:12px;font-size:16px;font-family:inherit;
}
.field textarea{min-height:70px;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--yellow);border-color:var(--yellow);}
.preset-row{display:flex;gap:6px;margin-top:8px;}
.preset-row button{
  flex:1;background:var(--steel-700);border:none;color:var(--text);border-radius:6px;padding:8px 4px;
  font-size:12px;font-weight:700;min-height:36px;
}
.stage-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.stage-picker button{
  background:var(--steel-800);border:1.5px solid var(--steel-600);color:var(--text);border-radius:8px;
  padding:12px 8px;font-size:12px;font-weight:700;text-transform:uppercase;min-height:48px;
}
.stage-picker button.current{border-color:var(--yellow);color:var(--yellow);}

/* ---------- Assistant ---------- */
.chat-log{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.chat-msg{max-width:92%;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.5;white-space:pre-wrap;}
.chat-msg.user{align-self:flex-end;background:var(--yellow);color:#241a00;font-weight:600;}
.chat-msg.ai{align-self:flex-start;background:var(--steel-800);border:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:8px;}
.chat-msg.ai.loading{color:var(--text-dim);font-style:italic;}
.copy-btn{
  background:var(--steel-700);border:none;color:var(--text-dim);font-size:11px;font-weight:700;
  text-transform:uppercase;padding:6px 11px;border-radius:6px;align-self:flex-start;
}
.prompt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.prompt-grid button{
  background:var(--steel-800);border:1px solid var(--line);color:var(--text);border-radius:8px;
  padding:10px 8px;font-size:12px;font-weight:600;text-align:left;min-height:56px;line-height:1.3;
}
.chat-input-row{display:flex;gap:8px;position:sticky;bottom:0;background:var(--steel-950);padding-top:8px;}
.chat-input-row input{
  flex:1;background:var(--steel-800);border:1.5px solid var(--steel-600);color:var(--text);
  border-radius:8px;padding:12px;font-size:16px;
}
.chat-input-row input:focus{outline:2px solid var(--yellow);border-color:var(--yellow);}

/* ---------- Tab bar ---------- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--steel-900);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:100;
}
.tab-btn{
  flex:1;background:none;border:none;color:var(--text-faint);display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:9px 1px 8px 1px;font-size:9px;font-weight:700;text-transform:uppercase;
  letter-spacing:0;min-height:56px;position:relative;min-width:0;
}
.tab-btn .ic{font-size:18px;}
.tab-btn.active{color:var(--yellow);}
.tab-btn .dot{
  position:absolute;top:4px;right:calc(50% - 20px);width:8px;height:8px;background:var(--red);
  border-radius:50%;
}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-faint);}
.empty-state .big{font-size:32px;margin-bottom:8px;}
.hidden{display:none !important;}
.search-input{
  width:100%;background:var(--steel-800);border:1.5px solid var(--steel-600);color:var(--text);
  border-radius:8px;padding:11px 12px;font-size:16px;margin-bottom:10px;
}

/* ---------- Blueprint extraction ---------- */
.field input[type=file]{
  background:var(--steel-800);border:1.5px dashed var(--steel-600);padding:12px;color:var(--text-dim);font-size:13px;
}
.bp-preview-img{
  width:100%;max-height:220px;object-fit:contain;border-radius:8px;border:1px solid var(--line);
  background:var(--steel-800);margin-top:10px;
}
.bp-file-chip{
  background:var(--steel-800);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  font-size:13px;margin-top:10px;
}
.bom-list{display:flex;flex-direction:column;gap:8px;}
.bom-row{background:var(--steel-800);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
.bom-item{font-weight:700;font-size:13px;}
.bom-spec{font-size:12px;color:var(--text-dim);margin-top:2px;}
.bom-qty{font-size:11px;color:var(--text-faint);margin-top:4px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.bp-hint{font-size:11px;color:var(--text-faint);margin-top:6px;line-height:1.4;}
.bp-preview-img{cursor:zoom-in;}

/* ---------- Fullscreen blueprint viewer ---------- */
.bp-fullscreen{
  position:fixed;inset:0;background:#0b0d0f;z-index:400;display:flex;flex-direction:column;
}
.bp-fs-bar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;
  background:var(--steel-900);border-bottom:1px solid var(--line);flex-shrink:0;
}
.bp-fs-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
.bp-fs-stage{flex:1;overflow:hidden;position:relative;touch-action:none;background:#0b0d0f;}
.bp-fs-img{
  position:absolute;top:0;left:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;
  max-width:none;
}
.bp-fs-hint{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);
  color:var(--text-dim);font-size:11px;padding:6px 12px;border-radius:20px;pointer-events:none;
}

/* ---------- 3D model viewer ---------- */
.model-stage{
  width:100%;height:260px;background:var(--steel-900);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;position:relative;touch-action:none;margin-bottom:10px;
}
.model-stage canvas{display:block;width:100%;height:100%;}
.model-legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.model-chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--steel-800);border:1px solid var(--line);
  border-radius:20px;padding:6px 11px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
}
.model-chip.dim{opacity:.4;}
.model-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.model-specs{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--text-dim);margin-bottom:10px;}
.model-specs b{color:var(--text);}
.eng-table{background:var(--steel-900);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:10px;}
.eng-group{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--yellow);background:var(--steel-800);padding:7px 12px;text-transform:uppercase;}
.eng-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 12px;border-bottom:1px solid var(--steel-800);}
.eng-row:last-child{border-bottom:none;}
.eng-label{font-size:12px;color:var(--text-dim);}
.eng-val{font-size:13px;font-weight:700;text-align:right;}
.eng-extra{font-size:10px;color:var(--text-faint);font-weight:400;}
.eng-meta{grid-column:1/-1;display:flex;gap:8px;align-items:center;}
.eng-src{font-size:10px;color:var(--text-faint);}

<script>
/* =========================================================
   ASSEMBLY WORKFLOW TRACKER
   Vanilla JS single-file frontend. Jobs/blockers/notes are stored in a
   Supabase project (see SUPABASE_URL / SUPABASE_ANON_KEY below) --
   shared live across every device automatically, no server to deploy
   or maintain. AI features (Assistant + Blueprint extraction) call
   Google's free Gemini API directly using a key each person enters
   once in Settings, stored only in their own browser.
   ========================================================= */

const STAGES = [
  {id:'ready',    label:'Ready for Assembly'},
  {id:'layout',   label:'Layout'},
  {id:'bearings', label:'Bearings Installed'},
  {id:'drive',    label:'Drive Installed'},
  {id:'final',    label:'Final Assembly'},
  {id:'testing',  label:'Testing'},
  {id:'qc',       label:'Ready for QC'},
  {id:'complete', label:'Complete'}
];
const stageLabel = id => (STAGES.find(s=>s.id===id)||{}).label || id;

// Shop-standard assembly procedure -- tracked per job as a checklist so
// assemblers can check off each step as they physically complete it.
const PROCEDURE = [
  { title:'Verify Hardware & Purchased Components', items:[
    'Verify all hardware and purchased components against the approved drawing and BOM.',
    'Confirm the correct quantity, size, type, and specification of each component.',
    'Verify bearings, seals, sprockets, shafts, couplings, drives, and other purchased components are correct for the job.',
    'Inspect all components for damage or defects.',
    'Set aside any incorrect, damaged, or missing components and notify the assembly lead/supervisor.'
  ]},
  { title:'Verify Fabricated Parts', items:[
    'Verify all fabricated parts against the approved drawing and BOM.',
    'Confirm all measurements and dimensions are correct.',
    'Verify hole locations, mounting patterns, lengths, widths, and overall configuration.',
    'Inspect fabricated parts for defects that could affect assembly.',
    'Report any discrepancies before beginning assembly.'
  ]},
  { title:'Assemble Troughs', items:[
    'Assemble trough sections in the correct order according to the approved drawing.',
    'Verify proper orientation of each trough section.',
    'Align and join the trough sections.',
    'Install the required hardware.',
    'Verify the assembled trough is straight, square, and properly aligned.'
  ]},
  { title:'Assemble Screws, Troughs, Couplings & Shafts', items:[
    'Install screw sections into the assembled troughs in the correct order and orientation.',
    'Assemble and connect screw sections using the specified couplings and hardware.',
    'Install required shafts according to the approved drawing.',
    'Verify screw flight direction and positioning.',
    'Verify proper shaft and coupling alignment.',
    'Secure all coupling and shaft connections.'
  ]},
  { title:'Assemble Drive End', items:[
    'Install the required waste pack, flange gland, and/or bearings at the drive end, as specified by the drawing.',
    'Install and secure the drive shaft and drive components.',
    'Install the drive plate and required hardware.',
    'Verify proper alignment of the shaft, bearings, seals, and drive.',
    'Ensure all components are properly positioned and secured.'
  ]},
  { title:'Mark, Drill & Install Hanger Bearings', items:[
    'Mark hanger bearing locations according to the approved drawing.',
    'Verify hanger locations and spacing before drilling.',
    'Drill the required mounting holes.',
    'Remove burrs and clean the drilled areas.',
    'Install hanger bearings and required hardware.',
    'Verify hanger bearing alignment with the screw shaft.',
    'Secure all hanger bearing hardware.'
  ]},
  { title:'Assemble Tail End', items:[
    'Install the tail end onto the conveyor.',
    'Install any required bearings, seals, waste pack, or flange gland as specified by the drawing.',
    'Install the tail shaft and associated hardware, if applicable.',
    'Verify proper shaft and bearing alignment.',
    'Secure all hardware and ensure the tail end is properly positioned.'
  ]}
];
const PROCEDURE_TOTAL = PROCEDURE.reduce((n,s)=>n+s.items.length, 0);
// "2-1" -> "Assemble Troughs / Verify proper orientation..." for the log.
function checklistItemLabel(key){
  const [si, ii] = String(key).split('-').map(Number);
  const step = PROCEDURE[si];
  if(!step) return key;
  const item = step.items[ii];
  return item ? `${step.title} / ${item}` : step.title;
}

// Maps each Board stage to the procedure step(s) that must be completed
// while a job sits in that stage, before it can advance to the next one.
// Indices refer to PROCEDURE above. Stages not listed (testing, qc,
// complete) have no gating checklist -- they're sign-off stages, not
// build steps.
const STAGE_PROCEDURE = {
  ready:    [0, 1], // Verify Hardware & Purchased Components, Verify Fabricated Parts
  layout:   [2, 3], // Assemble Troughs, Assemble Screws/Couplings/Shafts
  bearings: [5],    // Mark, Drill & Install Hanger Bearings
  drive:    [4],    // Assemble Drive End
  final:    [6]     // Assemble Tail End
};
function stageChecklistProgress(job, stageId){
  const stepIdxs = STAGE_PROCEDURE[stageId] || [];
  const checked = job.checklist || {};
  let total = 0, done = 0;
  stepIdxs.forEach(si=> PROCEDURE[si].items.forEach((_,ii)=>{
    total++;
    if(checked[si+'-'+ii]) done++;
  }));
  return { done, total };
}

// Automation: quick stage moves (arrows / mover / dashboard advance) snap
// percent-complete to a sensible baseline for that stage, so the Lead
// doesn't have to separately open a form and drag a slider every time.
const STAGE_DEFAULT_PERCENT = {
  ready:0, layout:15, bearings:30, drive:50, final:65, testing:80, qc:92, complete:100
};

let selectedBlueprintFile = null;

const state = {
  tab: 'dashboard',
  jobs: [],
  blockers: [],
  notes: [],
  jobFilter: 'all',
  jobSearch: '',
  blockerFilter: 'active',
  noteSearch: '',
  activity: [],
  activitySearch: '',
  chat: []
};

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
function daysUntil(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const t = new Date(todayISO()+'T00:00:00');
  return Math.round((d-t)/86400000);
}
function fmtDate(dateStr){
  if(!dateStr) return '--';
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function distinctValues(field, arr, extra){
  const set = new Set((extra||[]));
  arr.forEach(x=>{ if(x[field]) set.add(x[field]); });
  return [...set].filter(v=>v && v!=='Unassigned').sort();
}
function datalistHtml(id, values){
  return `<datalist id="${id}">${values.map(v=>`<option value="${escapeHtml(v)}">`).join('')}</datalist>`;
}

function dueStatus(job){
  if(job.assemblyStatus === 'complete') return 'complete';
  const du = daysUntil(job.dueDate);
  if(du < 0) return 'overdue';
  if(du <= 3) return 'soon';
  return 'ok';
}
function dueStatusLabel(s){
  return {overdue:'Overdue', soon:'Due Soon', ok:'On Schedule', complete:'Complete'}[s];
}
function openBlockerJobSet(){
  return new Set(state.blockers.filter(b=>b.status!=='Resolved').map(b=>b.jobNumber));
}

/* Filters shown as chips on the Dashboard -- also the target of tapping
   a metric card, so the two systems stay in sync (1 tap from a metric
   straight to the matching filtered list). */
function getJobFilters(){
  const blockedSet = openBlockerJobSet();
  return [
    {id:'all', label:'All', test:()=>true},
    {id:'overdue', label:'Overdue', test:j=>dueStatus(j)==='overdue'},
    {id:'soon', label:'Due Soon', test:j=>dueStatus(j)==='soon'},
    {id:'week', label:'Due This Week', test:j=> j.assemblyStatus!=='complete' && daysUntil(j.dueDate)>=0 && daysUntil(j.dueDate)<=7},
    {id:'blocked', label:'Blocked', test:j=> blockedSet.has(j.jobNumber)},
    {id:'ready', label:'Ready', test:j=> j.assemblyStatus==='ready'},
    {id:'inprogress', label:'In Progress', test:j=> j.assemblyStatus!=='ready' && j.assemblyStatus!=='complete'},
    {id:'ok', label:'On Schedule', test:j=>dueStatus(j)==='ok'},
    {id:'complete', label:'Complete', test:j=>dueStatus(j)==='complete'}
  ];
}
const BLOCKER_FILTERS = [
  {id:'active', label:'Active', test:b=>b.status!=='Resolved'},
  {id:'open', label:'Open', test:b=>b.status==='Open'},
  {id:'inprogress', label:'In Progress', test:b=>b.status==='In Progress'},
  {id:'resolved', label:'Resolved', test:b=>b.status==='Resolved'},
  {id:'all', label:'All', test:()=>true}
];

/* ---------------- Seed data (first run only) ---------------- */
function seedJobs(){
  const t = new Date();
  const iso = off => { const d=new Date(t); d.setDate(d.getDate()+off); return d.toISOString().slice(0,10); };
  return [
    {id:uid('job'), jobNumber:'SC-4471', customer:'Midwest Grain Co.', description:'14" x 40ft screw conveyor, carbon steel trough, drive end gearmotor', dueDate: iso(-2), priority:'High', assignedAssembler:'D. Reyes', assemblyStatus:'testing', percentComplete:80},
    {id:uid('job'), jobNumber:'SC-4472', customer:'Prairie Feed Systems', description:'9" x 22ft shafted conveyor, stainless, sanitary flush ends', dueDate: iso(1), priority:'High', assignedAssembler:'M. Okafor', assemblyStatus:'drive', percentComplete:55},
    {id:uid('job'), jobNumber:'SC-4473', customer:'Redline Aggregates', description:'16" shaftless conveyor, U-trough, abrasion resistant liner', dueDate: iso(6), priority:'Medium', assignedAssembler:'J. Whitfield', assemblyStatus:'layout', percentComplete:20},
    {id:uid('job'), jobNumber:'SC-4474', customer:'Great Lakes Cement', description:'12" x 30ft incline conveyor, 15deg incline, flighting cleats', dueDate: iso(10), priority:'Low', assignedAssembler:'Unassigned', assemblyStatus:'ready', percentComplete:0},
    {id:uid('job'), jobNumber:'SC-4465', customer:'Heartland Ethanol', description:'10" x 18ft transfer conveyor, replacement unit', dueDate: iso(-6), priority:'High', assignedAssembler:'D. Reyes', assemblyStatus:'qc', percentComplete:95},
    {id:uid('job'), jobNumber:'SC-4468', customer:'Bluegrass Milling', description:'8" x 12ft short-run conveyor, painted mild steel', dueDate: iso(3), priority:'Medium', assignedAssembler:'M. Okafor', assemblyStatus:'bearings', percentComplete:35},
    {id:uid('job'), jobNumber:'SC-4460', customer:'Delta Ag Processing', description:'20" x 45ft high-capacity conveyor, twin drive', dueDate: iso(-1), priority:'High', assignedAssembler:'J. Whitfield', assemblyStatus:'final', percentComplete:70},
    {id:uid('job'), jobNumber:'SC-4455', customer:'Northstar Fertilizer', description:'12" x 25ft conveyor, epoxy coated trough', dueDate: iso(-10), priority:'Medium', assignedAssembler:'D. Reyes', assemblyStatus:'complete', percentComplete:100}
  ];
}
function seedBlockers(jobs){
  const j1 = jobs.find(j=>j.jobNumber==='SC-4472');
  const j2 = jobs.find(j=>j.jobNumber==='SC-4468');
  return [
    {id:uid('blk'), jobNumber:j1?j1.jobNumber:'SC-4472', issueDescription:'Gearmotor shipment delayed from vendor, ETA unknown', responsibleDepartment:'Purchasing', dateReported: todayISO(), severity:'Critical', status:'Open'},
    {id:uid('blk'), jobNumber:j2?j2.jobNumber:'SC-4468', issueDescription:'Bearing bore size mismatch, needs engineering review', responsibleDepartment:'Engineering', dateReported: todayISO(), severity:'High', status:'In Progress'}
  ];
}
function seedNotes(jobs){
  return [
    {id:uid('note'), date: todayISO(), jobNumber:'SC-4471', noteType:'Progress', notes:'Trough sections aligned and tack welded, moving into final testing tomorrow.'},
    {id:uid('note'), date: todayISO(), jobNumber:'SC-4472', noteType:'Issue', notes:'Waiting on gearmotor from vendor, cannot proceed to drive install.'},
    {id:uid('note'), date: todayISO(), jobNumber:'SC-4472', noteType:'NextSteps', notes:'Follow up with purchasing on gearmotor ETA first thing tomorrow.'}
  ];
}

/* ---------------- Storage ----------------
   Data lives in a Supabase project, in one table (app_data: key text
   primary key, value jsonb). The "anon" key below is meant to be public
   -- Supabase's model is that access control happens via database
   policies, not by hiding this key -- so unlike a GitHub token, there's
   nothing here for a scanner to find and revoke, and nothing sensitive
   in this page's source. Set SUPABASE_URL and SUPABASE_ANON_KEY to your
   project's values (Project Settings -> API). */
const SUPABASE_URL = 'https://cxzogbtjxcfzgybtquwd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_kSu43otuTKZTtjeLPmuT3g_Kop5RzGz';

function supabaseReady(){
  return !!(SUPABASE_URL && SUPABASE_URL !== 'SUPABASE_URL_HERE' && SUPABASE_ANON_KEY && SUPABASE_ANON_KEY !== 'SUPABASE_ANON_KEY_HERE');
}
function supabaseHeaders(extra){
  return {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    'Content-Type': 'application/json',
    ...(extra||{})
  };
}
async function storageGet(key){
  if(!supabaseReady()) return null;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_data?key=eq.${encodeURIComponent(key)}&select=value`, {
      headers: supabaseHeaders(),
      cache: 'no-store'
    });
    if(!res.ok){
      const body = await res.json().catch(()=>({}));
      throw new Error(body.message || `Supabase read failed (${res.status})`);
    }
    const rows = await res.json();
    return (rows && rows[0]) ? rows[0].value : null;
  }catch(e){
    console.error('storage get failed', key, e);
    return null;
  }
}
async function storageSet(key, value){
  if(!supabaseReady()) return false;
  try{
    // Upsert -- Postgres handles this atomically, so unlike the old
    // GitHub-file approach there's no sha/version to track or retry on.
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_data`, {
      method: 'POST',
      headers: supabaseHeaders({ 'Prefer': 'resolution=merge-duplicates' }),
      body: JSON.stringify([{ key, value }])
    });
    if(!res.ok){
      const body = await res.json().catch(()=>({}));
      throw new Error(body.message || `Supabase save failed (${res.status})`);
    }
    return true;
  }catch(e){
    console.error('storage set failed', key, e);
    const detail = (e && e.message) ? e.message : 'unknown error';
    showToast(`Could not save "${key}": ${detail}`, 6000);
    return false;
  }
}

/* ---------------- Activity log ----------------
   A separate insert-only table (not the app_data blob) so entries from
   different people at the same moment can never overwrite each other --
   every action appends its own row. Logging is fire-and-forget: it must
   never block or fail the actual work the person is doing. */
async function logActivity(action, detail){
  if(!supabaseReady()) return;
  const who = getUserName() || 'Unknown';
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/activity_log`, {
      method: 'POST',
      headers: supabaseHeaders({ 'Prefer': 'return=minimal' }),
      body: JSON.stringify([{ who, action, detail: detail || '' }])
    });
  }catch(e){
    console.error('activity log failed', e); // deliberately silent to the user
  }
}
async function fetchActivityLog(limit){
  if(!supabaseReady()) return [];
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/activity_log?select=*&order=at.desc&limit=${limit||200}`, {
      headers: supabaseHeaders(),
      cache: 'no-store'
    });
    if(!res.ok) return [];
    return await res.json();
  }catch(e){ return []; }
}

/* ---------------- Blueprint image storage ----------------
   Reuses the same app_data table -- one image per job, stored as a
   base64 string under key "blueprint:{jobId}". Used by the Job Detail
   view to show the real scanned drawing, not just the extracted list. */
const blueprintImageCache = {}; // jobId -> base64 string once loaded, or false if confirmed missing
async function saveBlueprintImage(jobId, base64Jpeg){
  if(!base64Jpeg) return false;
  return storageSet(`blueprint:${jobId}`, base64Jpeg);
}
async function fetchBlueprintImage(jobId){
  return storageGet(`blueprint:${jobId}`);
}

async function loadAll(){
  if(!supabaseReady()){ state.jobs = []; state.blockers = []; state.notes = []; return; }
  let [jobs, blockers, notes] = await Promise.all([
    storageGet('jobs'), storageGet('blockers'), storageGet('notes')
  ]);
  if(jobs === null){ jobs = seedJobs(); await storageSet('jobs', jobs); }
  if(blockers === null){ blockers = seedBlockers(jobs); await storageSet('blockers', blockers); }
  if(notes === null){ notes = seedNotes(jobs); await storageSet('notes', notes); }
  state.jobs = jobs; state.blockers = blockers; state.notes = notes;
}
// Rapid successive edits (e.g. checking off several checklist items in a
// row) used to fire one GitHub save per tap, which race each other and
// fail with 409 conflicts. Coalesce them: wait briefly for things to
// settle, then save once with whatever the latest state is.
const saveTimers = {};
function persistKey(key, getValue, delay){
  return new Promise(resolve=>{
    clearTimeout(saveTimers[key]);
    saveTimers[key] = setTimeout(async ()=>{
      resolve(await storageSet(key, getValue()));
    }, delay || 500);
  });
}
async function persistJobs(){ return persistKey('jobs', ()=>state.jobs); }
async function persistBlockers(){ return persistKey('blockers', ()=>state.blockers); }
async function persistNotes(){ return persistKey('notes', ()=>state.notes); }

/* ---------------- Multi-device sync ----------------
   Polls the shared GitHub repo periodically so every device converges on
   the same data. GitHub's API has a rate limit (5,000 requests/hour per
   token), so this polls modestly -- every 45s -- and pauses while a form
   is open or someone's typing, so nothing gets overwritten mid-edit. */
function isFormActive(){
  const modalOpen = document.getElementById('modalRoot').innerHTML.trim().length>0;
  const a = document.activeElement;
  const typing = a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT');
  return modalOpen || typing;
}
async function reloadFromStorage(manual){
  if(!supabaseReady()) return;
  if(isFormActive()){
    if(manual) showToast('Finish editing, then sync');
    return;
  }
  if(manual){
    const btn = document.getElementById('refreshBtn');
    if(btn) btn.classList.add('spinning');
  }
  const [jobs, blockers, notes] = await Promise.all([storageGet('jobs'), storageGet('blockers'), storageGet('notes')]);
  if(jobs) state.jobs = jobs;
  if(blockers) state.blockers = blockers;
  if(notes) state.notes = notes;
  render();
  if(manual){
    showToast('Synced latest data');
    const btn = document.getElementById('refreshBtn');
    if(btn) setTimeout(()=>btn.classList.remove('spinning'), 700);
  }
}
setInterval(()=>reloadFromStorage(false), 45000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) reloadFromStorage(false); });

/* ---------------- Toast ---------------- */
let toastTimer=null;
function showToast(msg, duration){
  const root = document.getElementById('toastRoot');
  root.innerHTML = `<div class="toast">${escapeHtml(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ root.innerHTML=''; }, duration || 2200);
}
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast('Copied to clipboard')).catch(()=>showToast('Could not copy'));
  }else{
    showToast('Copy not supported on this device');
  }
}

/* ---------------- Modal helpers ---------------- */
// Modals that need to update themselves in place (checklist toggles, a
// stage advancing while its detail view is open) register a refresher
// here instead of hardcoding which modal to redraw.
let modalRefresh = null;
function closeModal(){
  disposeModel();
  refreshOpenModal._job = null;
  document.getElementById('modalRoot').innerHTML='';
  modalRefresh = null;
}
function openModal(html, refresher){
  modalRefresh = refresher || null;
  document.getElementById('modalRoot').innerHTML = `<div class="modal-overlay" data-close-overlay>${html}</div>`;
  setTimeout(()=>{
    const f = document.querySelector('.modal-sheet input:not([readonly]):not([type=range]), .modal-sheet select, .modal-sheet textarea');
    if(f) f.focus();
  }, 50);
}
function refreshOpenModal(){
  const modalRoot = document.getElementById('modalRoot');
  if(modalRefresh && modalRoot && modalRoot.innerHTML.trim()){
    // Re-rendering the sheet destroys the 3D canvas, so tear the old
    // renderer down and rebuild it against the new DOM node.
    disposeModel();
    modalRoot.innerHTML = `<div class="modal-overlay" data-close-overlay>${modalRefresh()}</div>`;
    if(document.getElementById('modelStage') && refreshOpenModal._job){
      setTimeout(()=>buildModel(refreshOpenModal._job), 60);
    }
  }
}
document.addEventListener('click', e=>{
  if(e.target.hasAttribute('data-close-overlay')) closeModal();
});

/* ---------------- Metrics ---------------- */
function computeMetrics(){
  const jobs = state.jobs;
  const inProgress = jobs.filter(j=>j.assemblyStatus!=='ready' && j.assemblyStatus!=='complete').length;
  const readyCount = jobs.filter(j=>j.assemblyStatus==='ready').length;
  const blockedCount = openBlockerJobSet().size;
  const dueThisWeek = jobs.filter(j=>{
    if(j.assemblyStatus==='complete') return false;
    const du = daysUntil(j.dueDate);
    return du >= 0 && du <= 7;
  }).length;
  const overdue = jobs.filter(j=> j.assemblyStatus!=='complete' && daysUntil(j.dueDate) < 0).length;
  return {inProgress, readyCount, blockedCount, dueThisWeek, overdue};
}
function renderMetrics(){
  const m = computeMetrics();
  const el = document.getElementById('metricsStrip');
  el.innerHTML = `
    <button class="metric-card m-blue" data-action="goto-filter" data-filter="inprogress"><div class="num">${m.inProgress}</div><div class="lbl">In Progress</div></button>
    <button class="metric-card m-yellow" data-action="goto-filter" data-filter="ready"><div class="num">${m.readyCount}</div><div class="lbl">Ready to Start</div></button>
    <button class="metric-card m-red" data-action="goto-filter" data-filter="blocked"><div class="num">${m.blockedCount}</div><div class="lbl">Blocked</div></button>
    <button class="metric-card m-amber" data-action="goto-filter" data-filter="week"><div class="num">${m.dueThisWeek}</div><div class="lbl">Due This Week</div></button>
    <button class="metric-card m-red" data-action="goto-filter" data-filter="overdue"><div class="num">${m.overdue}</div><div class="lbl">Overdue</div></button>
  `;
  const blkTab = document.querySelector('.tab-btn[data-tab="blockers"]');
  if(blkTab){
    const existing = blkTab.querySelector('.dot');
    if(existing) existing.remove();
    if(m.blockedCount>0){
      const dot=document.createElement('span'); dot.className='dot'; blkTab.appendChild(dot);
    }
  }
}

/* ================= DASHBOARD ================= */
function computeFocusJobs(){
  const blockedSet = openBlockerJobSet();
  const scored = state.jobs.filter(j=>j.assemblyStatus!=='complete').map(j=>{
    const du = daysUntil(j.dueDate);
    let score = 0;
    if(du<0) score += 500 + Math.min(Math.abs(du),30)*10;
    else if(du<=3) score += 200 - du*20;
    else if(du<=7) score += 80 - du*5;
    score += {High:120, Medium:60, Low:20}[j.priority] || 0;
    if(blockedSet.has(j.jobNumber)) score += 250;
    return {job:j, score};
  }).sort((a,b)=>b.score-a.score);
  return scored;
}
function focusBannerHtml(){
  const scored = computeFocusJobs();
  const top = scored.filter(s=>s.score>=80).slice(0,3);
  if(top.length===0){
    return `
    <div class="focus-banner">
      <div class="focus-banner-head">Today's Focus</div>
      <div class="focus-calm">&#9989; Nothing urgent -- schedule looks on track.</div>
      <button class="btn btn-outline btn-sm" data-action="ask-ai-focus">Ask AI for full plan &#9656;</button>
    </div>`;
  }
  const chips = top.map(s=>{
    const ds = dueStatus(s.job);
    return `<span class="focus-job-chip">${escapeHtml(s.job.jobNumber)}<span class="fd due-tag due-${ds}">${dueStatusLabel(ds)}</span></span>`;
  }).join('');
  return `
  <div class="focus-banner">
    <div class="focus-banner-head">Today's Focus</div>
    <div class="focus-jobs">${chips}</div>
    <button class="btn btn-primary btn-sm" data-action="ask-ai-focus">Ask AI for full plan &#9656;</button>
  </div>`;
}

    const advanceLabel = nextStage
      ? (stageProgress.total>0
          ? `Advance &#9656; ${escapeHtml(nextStage.label)} (${stageProgress.done}/${stageProgress.total})`

        </div>
        <span class="badge badge-${j.priority.toLowerCase()}">${escapeHtml(j.priority)}</span>
      </div>
      <div class="job-desc">${escapeHtml(j.description)}</div>
      <div class="job-meta-row">
        <span>Stage: <b>${escapeHtml(stageLabel(j.assemblyStatus))}</b></span>
        <span>Assembler: <b>${escapeHtml(j.assignedAssembler||'Unassigned')}</b></span>
        <span>Due: <b>${fmtDate(j.dueDate)}</b></span>
        ${isBlocked ? `<span style="color:var(--red);font-weight:700;">&#9888; Blocked</span>` : ''}
      </div>
      <div class="gauge">
        <div class="gauge-track"><div class="gauge-fill" style="width:${j.percentComplete}%;"></div></div>
        <div class="gauge-label"><span class="due-tag due-${ds}">${dueText}</span> &middot; ${j.percentComplete}%</div>

  }).join('') : `<div class="empty-state"><div class="big">&#128203;</div>No jobs match this filter.</div>`;

  document.getElementById('jobCardsList').innerHTML = cardsHtml;

let dragJobId = null;
function renderBoard(){
  const cols = STAGES.map(stage=>{
    const jobs = state.jobs.filter(j=>j.assemblyStatus===stage.id);
    const cardsHtml = jobs.length ? jobs.map(j=>`
      <div class="board-card" draggable="true" data-id="${j.id}">
        <div class="bn" data-action="open-job-detail" data-id="${j.id}">${escapeHtml(j.jobNumber)}</div>
        <div class="bc" data-action="open-job-detail" data-id="${j.id}">${escapeHtml(j.customer)}</div>
        <div class="ba" data-action="open-job-detail" data-id="${j.id}">${escapeHtml(j.assignedAssembler||'Unassigned')} &middot; ${j.percentComplete}%</div>
        <div class="board-card-actions">
          <button class="icon-btn" data-action="stage-prev" data-id="${j.id}" title="Move back">&#8592;</button>
          <button class="move-btn" data-action="open-mover" data-id="${j.id}">Move&#8230;</button>
          <button class="icon-btn" data-action="attempt-advance" data-id="${j.id}" title="Move forward">&#8594;</button>
        </div>
      </div>
    `).join('') : `<div class="empty-col">No jobs</div>`;
    return `
    <div class="board-col">
      <div class="board-col-head"><span class="t">${stage.label}</span><span class="c">${jobs.length}</span></div>
      <div class="board-col-body" data-stage="${stage.id}">${cardsHtml}</div>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="section-title">Assembly Workflow Board</div>
    <div class="board-wrap" id="boardWrap">${cols}</div>
  `;
  attachBoardDnD();
}
function attachBoardDnD(){
  const cards = document.querySelectorAll('.board-card');
  cards.forEach(c=>{
    c.addEventListener('dragstart', e=>{
      dragJobId = c.getAttribute('data-id');
      e.dataTransfer.effectAllowed = 'move';
    });
  });
  const cols = document.querySelectorAll('.board-col-body');
  cols.forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('drag-over'));
    col.addEventListener('drop', e=>{
      e.preventDefault();
      col.classList.remove('drag-over');
      if(dragJobId){
        const targetStage = col.getAttribute('data-stage');
        const job = state.jobs.find(j=>j.id===dragJobId);
        if(job){
          const curIdx = STAGES.findIndex(s=>s.id===job.assemblyStatus);
          const targetIdx = STAGES.findIndex(s=>s.id===targetStage);
          if(targetIdx === curIdx+1){
            // Dragging one stage forward is the same move as the arrow button --
            // it must respect the same checklist gate, not silently skip it.
            const prog = stageChecklistProgress(job, job.assemblyStatus);
            if(prog.total>0 && prog.done<prog.total){
              showToast(`Complete this stage's checklist first -- tap the card to open it`);
              dragJobId = null;
              return;
            }
          }
          moveJobToStage(dragJobId, targetStage);
        }
        dragJobId = null;
      }
    });
  });
}
function moveJobToStage(jobId, stageId){
  const job = state.jobs.find(j=>j.id===jobId);
  if(!job) return;
  const prevStage = job.assemblyStatus;
  job.assemblyStatus = stageId;
  // Automation: snap percent-complete to the stage's standard baseline so
  // the Lead doesn't have to also open the edit form to update progress.
  job.percentComplete = STAGE_DEFAULT_PERCENT[stageId] !== undefined ? STAGE_DEFAULT_PERCENT[stageId] : job.percentComplete;
  const who = getUserName();
  if(who) job.lastMovedBy = who;
  persistJobs();
  logActivity('Stage moved', `${job.jobNumber}: ${stageLabel(prevStage)} -> ${stageLabel(stageId)}`);
  showToast(`${job.jobNumber} \u2192 ${stageLabel(stageId)}${who ? ` (${who})` : ''}`);
  render();
  refreshOpenModal();
}
function stepStage(jobId, dir){
  const job = state.jobs.find(j=>j.id===jobId);
  if(!job) return;
  const idx = STAGES.findIndex(s=>s.id===job.assemblyStatus);
  const newIdx = Math.min(STAGES.length-1, Math.max(0, idx+dir));
  moveJobToStage(jobId, STAGES[newIdx].id);
}
function openMover(jobId){
  const job = state.jobs.find(j=>j.id===jobId);
  if(!job) return;
  openModal(`
    <div class="modal-sheet">
      <div class="modal-title">Move ${escapeHtml(job.jobNumber)} <button class="modal-close" data-close-overlay>&times;</button></div>
      <div class="stage-picker">
        ${STAGES.map(s=>`<button class="${s.id===job.assemblyStatus?'current':''}" data-action="pick-stage" data-id="${job.id}" data-stage="${s.id}">${s.label}</button>`).join('')}
      </div>
    </div>
  `);
}

  `;

async function loadActivity(){
  const rows = await fetchActivityLog(300);
  state.activity = rows;
  updateActivityList();
}
function updateActivityList(){
  const el = document.getElementById('actList');
  if(!el) return;
  const q = state.activitySearch.trim().toLowerCase();
  let rows = state.activity || [];
  if(q){
    rows = rows.filter(r =>
      (r.who||'').toLowerCase().includes(q) ||
      (r.action||'').toLowerCase().includes(q) ||
      (r.detail||'').toLowerCase().includes(q)
    );
  }
  const badge = document.getElementById('actCountBadge');
  if(badge) badge.textContent = rows.length;
  if(!rows.length){
    el.innerHTML = `<div class="empty-state"><div class="big">&#128203;</div>No activity recorded yet.</div>`;
    return;
  }
  el.innerHTML = rows.map(r=>`
    <div class="act-row">
      <div class="act-head">
        <span class="act-who">${escapeHtml(r.who||'Unknown')}</span>
        <span class="act-when">${fmtWhen(r.at)}</span>
      </div>
      <div class="act-action">${escapeHtml(r.action||'')}</div>
      ${r.detail ? `<div class="act-detail">${escapeHtml(r.detail)}</div>` : ''}
    </div>`).join('');
}
function fmtWhen(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const mins = Math.round((now-d)/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins/60);
  if(hrs < 24) return `${hrs}h ago`;
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' +
         d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}

/* ================= ASSISTANT ================= */
const QUICK_PROMPTS = [
  'What should the team focus on today?',
  'Which jobs are at risk?',
  "Create today's shift summary.",
  'Generate a morning planning report.',
  'What hardware or components do we need to pull or order?'
];
function buildContext(){
  const jobs = state.jobs.map(j=>{
    const bom = (j.billOfMaterials && j.billOfMaterials.length)
      ? ` | hardware needed: ${j.billOfMaterials.map(c=>`${c.quantity?c.quantity+'x ':''}${c.item}${c.specification?' ('+c.specification+')':''}`).join(', ')}`
      : '';
    return `- ${j.jobNumber} | ${j.customer} | stage: ${stageLabel(j.assemblyStatus)} | priority: ${j.priority} | ${j.percentComplete}% complete | due: ${j.dueDate} (${dueStatusLabel(dueStatus(j))}) | assembler: ${j.assignedAssembler||'Unassigned'}${bom}`;
  }).join('\n');
  const blockers = state.blockers.filter(b=>b.status!=='Resolved').map(b=>`- ${b.jobNumber} | ${b.severity} | ${b.responsibleDepartment} | reported ${b.dateReported} | ${b.issueDescription} | status: ${b.status}`).join('\n') || 'None';
  const notes = state.notes.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,25)
    .map(n=>`- [${n.date}] ${n.jobNumber||'General'} (${n.noteType}): ${n.notes}`).join('\n') || 'None';
  return `Today's date: ${todayISO()}\n\nJOBS:\n${jobs}\n\nOPEN BLOCKERS:\n${blockers}\n\nRECENT DAILY NOTES:\n${notes}`;
}

const GEMINI_MODEL = 'gemini-3.6-flash';

// Two interchangeable AI backends, picked in Settings -- Google's free
// Gemini API by default, or OpenRouter as a backup/alternative (useful if
// Gemini's free-tier rate limit gets hit, or to try a different model for
// blueprint reading). Both keys are stored only in this browser and sent
// directly to their respective provider; never to each other or anywhere
// else. `content` uses the same shape either way: a plain string, or an
// array of {type:'text', text} / {type:'image', source:{media_type, data}}.
function toGeminiParts(content){
  if(typeof content === 'string') return [{ text: content }];
  return content.map(block=>{
    if(block.type === 'image'){
      return { inline_data: { mime_type: block.source.media_type, data: block.source.data } };
    }
    return { text: block.text || '' };
  });
}
async function callGeminiAPI(systemPrompt, content){
  const apiKey = getApiKey();
  if(!apiKey) throw new Error('NO_API_KEY');
  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      system_instruction: { parts: [{ text: systemPrompt }] },
      contents: [{ role: 'user', parts: toGeminiParts(content) }]
    })
  });
  const raw = await response.text();
  let data;
  try{ data = JSON.parse(raw); }catch(e){ throw new Error('Unexpected response from Gemini (not JSON). Please try again.'); }
  if(!response.ok){
    const apiMsg = (data && data.error && data.error.message) ? data.error.message : `Request failed (${response.status})`;
    throw new Error(apiMsg);
  }
  const candidate = data && data.candidates && data.candidates[0];
  const parts = candidate && candidate.content && candidate.content.parts;
  return parts ? parts.map(p=>p.text||'').filter(Boolean).join('\n') : '';
}
function toOpenRouterContent(content){
  if(typeof content === 'string') return content;
  return content.map(block=>{
    if(block.type === 'image'){
      return { type:'image_url', image_url:{ url:`data:${block.source.media_type};base64,${block.source.data}` } };
    }
    return { type:'text', text: block.text || '' };
  });
}
async function callOpenRouterAPI(systemPrompt, content){
  const apiKey = getOpenRouterKey();
  if(!apiKey) throw new Error('NO_API_KEY');
  const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`,
      'X-Title': 'Assembly Workflow Tracker'
    },
    body: JSON.stringify({
      model: getOpenRouterModel(),
      messages: [
        { role:'system', content: systemPrompt },
        { role:'user', content: toOpenRouterContent(content) }
      ]
    })
  });
  const raw = await response.text();
  let data;
  try{ data = JSON.parse(raw); }catch(e){ throw new Error('Unexpected response from OpenRouter (not JSON). Please try again.'); }
  if(!response.ok || (data && data.error)){
    let apiMsg = (data && data.error && data.error.message) ? data.error.message : `Request failed (${response.status})`;
    // OpenRouter often wraps the real reason one level deeper -- e.g. a
    // generic "Provider returned error" with the actual cause sitting in
    // error.metadata.raw (sometimes itself JSON from the underlying model).
    const meta = data && data.error && data.error.metadata;
    if(meta){
      if(meta.raw){
        let rawDetail = meta.raw;
        try{
          const parsedRaw = typeof rawDetail === 'string' ? JSON.parse(rawDetail) : rawDetail;
          rawDetail = (parsedRaw.error && parsedRaw.error.message) || parsedRaw.message || rawDetail;
        }catch(e){ /* raw wasn't JSON -- use it as-is */ }
        apiMsg += `: ${rawDetail}`;
      }else if(meta.provider_name){
        apiMsg += ` (from ${meta.provider_name})`;
      }
    }
    throw new Error(apiMsg);
  }
  const choice = data && data.choices && data.choices[0];
  if(!choice || !choice.message){
    throw new Error('OpenRouter returned no response content. The selected model may not support image input -- check Settings.');
  }
  return (choice.message.content) || '';
}
// Every call site in the app goes through this one function -- it routes
// to whichever provider is currently selected, so nothing else needs to
// know or care which backend is active.
async function callClaudeAPI(systemPrompt, content){
  return getAiProvider()==='openrouter'
    ? callOpenRouterAPI(systemPrompt, content)
    : callGeminiAPI(systemPrompt, content);
}

async function sendChat(promptText){
  const inputEl = document.getElementById('chatInput');
  const text = (promptText || (inputEl ? inputEl.value : '') || '').trim();
  if(!text) return;
  state.chat.push({role:'user', text});
  state.chat.push({role:'ai loading', text:'Thinking...'});
  renderAssistant();
  const input = document.getElementById('chatInput');
  if(input) input.value='';

  const systemPrompt = `You are the AI assistant embedded in the "Assembly Workflow Tracker" app, used by an Assembly Lead and Assemblers in a screw conveyor manufacturing shop. Use the shop data provided below to answer the user's question. Be concise, practical, and shop-floor-focused: use short paragraphs or bullet points, always reference specific job numbers when relevant, and rank priorities by a mix of overdue status, priority level, and open blockers. When asked for a shift summary or planning report, structure the answer with clear short headers and an action list. Avoid filler and avoid repeating the raw data back verbatim.\n\n${buildContext()}`;

  try{
    const reply = await callClaudeAPI(systemPrompt, text);
    state.chat.pop();
    state.chat.push({role:'ai', text: reply || 'No response received. Please try again.'});
  }catch(e){
    console.error(e);
    state.chat.pop();
    state.chat.push({role:'ai', text: explainFetchError(e)});
  }
  renderAssistant();
}

function openJobForm(jobId, prefill){
  const job = jobId ? state.jobs.find(j=>j.id===jobId) : null;
  const formData = job || Object.assign({jobNumber:'', customer:'', description:'', dueDate: todayISO(), priority:'Medium', assignedAssembler:'', assemblyStatus:'ready', percentComplete:0}, prefill||{});
  openModal(jobFormHtml(formData, !!job));
  document.getElementById('jobForm').addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const vals = Object.fromEntries(fd.entries());
    vals.percentComplete = parseInt(vals.percentComplete,10)||0;
    if(job){
      Object.assign(job, vals);
      logActivity('Job edited', `${vals.jobNumber} (${vals.customer})`);
    }else{
      if(state.jobs.some(j=>j.jobNumber===vals.jobNumber)){
        showToast('Job number already exists'); return;
      }
      const newJob = {id:(prefill && prefill.id) || uid('job'), ...vals};
      const hadExtraction = !!(prefill && ((prefill.billOfMaterials && prefill.billOfMaterials.length) || prefill.hasBlueprintImage));
      if(prefill && prefill.billOfMaterials && prefill.billOfMaterials.length){
        newJob.billOfMaterials = prefill.billOfMaterials;
      }
      if(prefill && prefill.geometry){
        newJob.geometry = prefill.geometry;
      }
      if(prefill && prefill.spec){
        newJob.spec = prefill.spec;
        newJob.validation = prefill.validation || null;
      }
      if(prefill && prefill.hasBlueprintImage){
        newJob.hasBlueprintImage = true;
      }
      if(hadExtraction){
        newJob.blueprintExtractedAt = prefill.blueprintExtractedAt || new Date().toISOString();
      }
      state.jobs.push(newJob);
      logActivity('Job created', `${vals.jobNumber} (${vals.customer})`);
    }
    persistJobs();
    closeModal();
    showToast('Job saved');
    render();
  });
}

function fileToBase64Raw(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
// Downscales large photos before sending, so uploads stay fast on shop-floor wifi/cell.
function fileToImageBase64Resized(file, maxDim, quality){
  maxDim = maxDim || 1400; quality = quality || 0.78;
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let width = img.width, height = img.height;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width*scale); height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,width,height);
        ctx.drawImage(img,0,0,width,height);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve({base64: dataUrl.split(',')[1], mime:'image/jpeg'});
      };
      img.onerror = ()=>reject(new Error('Could not read that image file.'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('Could not read that file.'));
    reader.readAsDataURL(file);
  });
}
// PDFs are rendered to images with pdf.js rather than uploaded raw -- this is
// far more reliable across drawing exports and keeps the payload small.
let pdfjsReadyPromise = null;
function ensurePdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfjsReadyPromise) return pdfjsReadyPromise;
  pdfjsReadyPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    script.onload = ()=>{
      try{
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        resolve(window.pdfjsLib);
      }catch(e){ reject(e); }
    };
    script.onerror = ()=> reject(new Error('Could not load the PDF reader. Check your connection and try again, or upload a photo/image instead.'));
    document.head.appendChild(script);
  });
  return pdfjsReadyPromise;
}
async function pdfFileToImages(file, maxPages, maxDim, quality){
  maxPages = maxPages || 10; maxDim = maxDim || 1700; quality = quality || 0.82;
  const pdfjsLib = await ensurePdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  const numPages = Math.min(pdf.numPages, maxPages);
  const images = [];
  for(let i=1; i<=numPages; i++){
    const page = await pdf.getPage(i);
    const baseViewport = page.getViewport({scale:1});
    const scale = Math.max(0.5, Math.min(maxDim/baseViewport.width, maxDim/baseViewport.height, 3));
    const viewport = page.getViewport({scale});
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    await page.render({canvasContext: ctx, viewport}).promise;
    const dataUrl = canvas.toDataURL('image/jpeg', quality);
    images.push({base64: dataUrl.split(',')[1], mime:'image/jpeg'});
  }
  return images;
}

function openStageGateModal(jobId){

function toggleStageChecklistItem(jobId, key){
  const job = state.jobs.find(j=>j.id===jobId);
  if(!job) return;
  if(!job.checklist) job.checklist = {};
  job.checklist[key] = !job.checklist[key];

  refreshOpenModal();

// Tapping Advance: if this stage has checklist items and they're not all
// done yet, open the gate modal instead of moving the job. Stages with no
// checklist items (or already fully checked) advance immediately.
function attemptAdvance(jobId){
  const job = state.jobs.find(j=>j.id===jobId);
  if(!job) return;
  const idx = STAGES.findIndex(s=>s.id===job.assemblyStatus);
  const nextStage = STAGES[idx+1];
  if(!nextStage) return;
  const { done, total } = stageChecklistProgress(job, job.assemblyStatus);
  if(total===0 || done===total){
    moveJobToStage(job.id, nextStage.id);
  }else{
    openStageGateModal(job.id);
  }
}

  const job = state.jobs.find(j=>j.id===jobId);
  if(!job) return;
  const idx = STAGES.findIndex(s=>s.id===job.assemblyStatus);

  moveJobToStage(job.id, nextStage.id);
}

// Compares what the drawing said against what the generator actually
// built. Any mismatch means the pipeline is wrong -- not the model.
function verificationReportHtml(job){
  const rec = lastBuildRecord;
  const spec = job.spec;
  if(!spec) return `<div class="modal-sheet"><div class="modal-title">Verification <button class="modal-close" data-close-overlay>&times;</button></div><div class="bp-hint">No specification.</div></div>`;
  if(!rec) return `<div class="modal-sheet"><div class="modal-title">Verification <button class="modal-close" data-close-overlay>&times;</button></div><div class="bp-hint">Open the 3D view first so there is a generated model to compare against.</div></div>`;
  const o = spec.overall||{}, tr = spec.trough||{}, sc = spec.screw||{}, fr = spec.frame||{};
  const rows = [];
  const cmp = (label, dim, builtVal) => {
    const bp = dimIn(dim);
    if(bp == null && builtVal == null) return;
    if(bp == null){ rows.push({label, bp:'--', gen:builtVal!=null?builtVal.toFixed(1)+'"':'--', diff:'--', status:'NO SOURCE'}); return; }
    if(builtVal == null){ rows.push({label, bp:bp.toFixed(1)+'"', gen:'not built', diff:'--', status:'OMITTED'}); return; }
    const diff = Math.abs(bp-builtVal);
    rows.push({label, bp:bp.toFixed(1)+'"', gen:builtVal.toFixed(1)+'"', diff:diff.toFixed(2), status: diff<0.01?'PASS':'FAIL'});
  };
  cmp('Overall length', o.overall_length, rec.built.overall_length_in);
  cmp('Trough width', tr.trough_width, rec.built.trough_width_in);
  cmp('Screw diameter', sc.screw_diameter, rec.built.screw_diameter_in);
  cmp('Screw pitch', sc.screw_pitch, rec.built.screw_pitch_in);
  cmp('Frame width', fr.frame_width, rec.built.frame_width_in);
  const incBp = dimIn(o.incline_angle)!=null ? o.incline_angle.value : null;
  if(incBp!=null || rec.built.incline_deg!=null){
    const d = Math.abs((incBp||0)-(rec.built.incline_deg||0));
    rows.push({label:'Incline angle', bp:(incBp!=null?incBp+'deg':'--'), gen:(rec.built.incline_deg||0)+'deg', diff:d.toFixed(2), status:d<0.01?'PASS':'FAIL'});
  }
  const hgCount = (spec.hangers&&spec.hangers.count!=null)?Number(spec.hangers.count):null;
  if(hgCount!=null || rec.built.hanger_count!=null){
    const g = rec.built.hanger_count!=null?rec.built.hanger_count:null;
    const d = (hgCount!=null&&g!=null)?Math.abs(hgCount-g):null;
    rows.push({label:'Hanger count', bp:hgCount!=null?String(hgCount):'--', gen:g!=null?String(g):'not built',
               diff:d!=null?String(d):'--', status: d===0?'PASS':(hgCount==null?'NO SOURCE':(g==null?'OMITTED':'FAIL'))});
  }
  const body = rows.length ? rows.map(r=>`
    <div class="ver-row">
      <div class="ver-label">${escapeHtml(r.label)}</div>
      <div class="ver-cells">
        <span title="blueprint">${escapeHtml(r.bp)}</span>
        <span title="generated">${escapeHtml(r.gen)}</span>
        <span title="difference">${escapeHtml(r.diff)}</span>
        <span class="ver-status vs-${r.status.toLowerCase().replace(/ /g,'-')}">${escapeHtml(r.status)}</span>
      </div>
    </div>`).join('') : `<div class="bp-hint">Nothing comparable was extracted.</div>`;

  const approxHtml = (rec.approx&&rec.approx.length)
    ? `<div class="section-title">Approximated / Not Available</div>` +
      rec.approx.map(a=>`<div class="val-line vc-warn">${escapeHtml(a)}</div>`).join('')
    : `<div class="val-line vc-ok">Nothing was approximated -- every element traces to a callout.</div>`;

  return `
  <div class="modal-sheet">
    <div class="modal-title">Verification -- ${escapeHtml(job.jobNumber)} <button class="modal-close" data-close-overlay>&times;</button></div>
    <div class="bp-hint" style="margin-bottom:10px;">Blueprint value vs. what the geometry generator actually built. A FAIL means the pipeline is wrong -- the fix belongs in extraction or generation, never in nudging the model.</div>
    <div class="ver-head"><div class="ver-label">Dimension</div><div class="ver-cells"><span>Blueprint</span><span>Generated</span><span>Diff</span><span>Status</span></div></div>
    ${body}
    ${approxHtml}
  </div>`;
}

let modelState = null; // { renderer, scene, camera, groups, raf }

function disposeModel(){
  if(!modelState) return;
  cancelAnimationFrame(modelState.raf);
  if(modelState.renderer){
    modelState.renderer.dispose();
    const el = modelState.renderer.domElement;
    if(el && el.parentNode) el.parentNode.removeChild(el);
  }
